<script>
/* S8: tests for the normal mean and for correlation */
(()=>{
const {B,lesson}=LEARN, {hand,tech,fill}=M, {eb,fr,sq,plot,seg,sl,ro,val,radio,set,on,r,field,stage,normPdf,Phi,invPhi}=AM;
lesson({id:"s8",group:"c",num:8,lvl:"Statistics · Lesson 8",name:"Testing a normal mean and correlation",icon:"hyp",
 eyebrow:eb("Statistics · Statistical hypothesis testing",8),title:"Hypothesis tests for the mean of a normal distribution and for zero correlation",
 intro:"If X ~ N(μ, σ²), the sample mean of n observations satisfies X̄ ~ N(μ, σ²/n). This lets you test a claim about μ when σ is known. You can also test whether a population correlation coefficient ρ is zero, using the sample PMCC r and a table of critical values.",
 outcomes:[["Conduct a statistical hypothesis test for the mean of a normal distribution with known, given or assumed variance and interpret the results in context","5.3"],["Use a hypothesis test for zero correlation using the PMCC r, given critical values","5.2"]],
 blocks:[
  B.text("Methods",`<div class="formula">X̄ ~ N(μ, ${fr("σ²","n")});   z = ${fr("x̄ − μ₀","σ/√n")}</div>`+tech("Normal mean test",["H₀: μ = μ₀; H₁: μ &lt; μ₀, μ &gt; μ₀ or μ ≠ μ₀.","Find P(X̄ ≥ x̄) (or ≤) under H₀, or compare z with the critical value (1.6449 at 5% one-tail, 1.96 at 5% two-tail).","Conclude in context."])+tech("Correlation test",["H₀: ρ = 0; H₁: ρ &gt; 0, ρ &lt; 0 or ρ ≠ 0.","Compare r with the critical value for the sample size n and significance level.","If |r| exceeds the critical value (in the direction of H₁), reject H₀."])),
  B.sim("s8-sim","Testing a mean",stage("s8",true),sl("s8-n","sample size n",4,64,1,16)+sl("s8-x","sample mean x̄",28,34,0.1,31.2)+field("Alternative",seg("s8-t",[["gt","μ &gt; 30"],["ne","μ ≠ 30"]],2,"gt"))+ro([["s8-z","Test statistic z"],["s8-p","p-value"],["s8-c","Critical region (5%)"]]),`<span>H₀: μ = 30, σ = 3 known; curve is the distribution of X̄ under H₀</span>`),
  hand("Test for the mean","Lengths are N(μ, 3²). Historically μ = 30. A sample of 16 has mean 31.2. Test at 5% whether the mean has increased.",[
   ["H₀: μ = 30, H₁: μ &gt; 30; under H₀ X̄ ~ N(30, 9/16)",""],
   ["P(X̄ ≥ 31.2) = P(Z ≥ 1.6) = 0.0548 &gt; 0.05",""],
   {m:"Do not reject H₀: insufficient evidence that the mean length has increased",ans:true}]),
  hand("Critical region for x̄","For the same test, find the critical region for X̄.",[
   ["reject if (x̄ − 30)/(3/4) &gt; 1.6449",""],
   {m:"X̄ &gt; 30 + 1.6449 × 0.75 = 31.23",ans:true}]),
  hand("Correlation test","For 12 days, r = 0.62 between temperature and ice-cream sales. Test at 5% for positive correlation. (Critical value for n = 12, one-tail 5%: 0.4973.)",[
   ["H₀: ρ = 0, H₁: ρ &gt; 0",""],
   ["0.62 &gt; 0.4973, so r is in the critical region",""],
   {m:"Reject H₀: evidence of positive correlation between temperature and sales",ans:true}]),
  fill("",[
   {q:"X ~ N(μ, 16). For a sample of 25, the standard deviation of X̄ is",lines:["[[0.8]]"],why:"4/5."},
   {q:"Two-tail 5% normal critical value",lines:["z = [[1.96|1.9600]]"],why:"2.5% each tail."},
   {q:"n = 20, r = −0.35, H₁: ρ &lt; 0, critical value 0.3783. Conclusion:",lines:["[[do not reject|not reject|accept]] H₀"],why:"|r| &lt; 0.3783."}]),
  M.check([
   {q:"X ~ N(μ, 25). A sample of 100 is taken. Var(X̄) = …",a:0.25,tol:0.001},
   {q:"Test statistic: x̄ = 52, μ₀ = 50, σ = 6, n = 36. z = …",a:2},
   {q:"z = 2.1 in a one-tail test at 1% (critical value 2.3263). Conclusion?",opts:["Reject H₀","Do not reject H₀"],a:1},
   {q:"In a correlation test, H₀ is …",opts:["r = 0","ρ = 0","ρ ≠ 0","r &gt; 0"],a:1},
   {q:"n = 10, r = 0.58, H₁: ρ ≠ 0 at 5% (critical value 0.6319). Is there evidence of correlation?",opts:["Yes","No"],a:1}]),
  B.keypoints(["X̄ ~ N(μ, σ²/n).","Use ρ (population) in hypotheses and r (sample) in the test.","Always conclude in context."]),
  B.mistakes(["Using σ²/n as the standard deviation (it is the variance).","Writing H₀: r = 0.","Forgetting to halve the significance level for two-tail tests."])
 ],onShow:()=>draw()});
function draw(){ const n=val("s8-n"), x=val("s8-x"), t=radio("s8-t"); set("s8-n-l",n); set("s8-x-l",r(x,1)); const se=3/Math.sqrt(n), z=(x-30)/se, f=v=>normPdf(v,30,se);
  const zc=t==="gt"?1.6449:1.96, cu=30+zc*se, cl=30-zc*se, top=Math.ceil(f(30)*11)/10, sh=[{f,a:cu,b:40,cls:"sh0"}]; if(t==="ne") sh.push({f,a:20,b:cl,cls:"sh0"});
  set("s8-plot",plot({x:[26,34],y:[0,top],ys:nice2(top),fns:[{f,c:1}],shade:sh,segs:[{x1:x,y1:0,x2:x,y2:top*0.9,c:2,w:3}],texts:[{x,y:top*0.94,t:"x̄",c:2}],xl:"x̄",yl:" ",aria:"Sampling distribution with critical region"}));
  const pv=t==="gt"?1-Phi(z):2*(1-Phi(Math.abs(z))); set("s8-z",r(z,3)); set("s8-p",r(pv,4)); set("s8-c",t==="gt"?`X̄ &gt; ${r(cu,2)}`:`X̄ &lt; ${r(cl,2)} or X̄ &gt; ${r(cu,2)}`);
  set("s8-note",pv<0.05?"p-value &lt; 0.05: reject H₀ (x̄ is in the shaded critical region).":"p-value ≥ 0.05: do not reject H₀."); }
function nice2(t){ return t>2?0.5:t>0.8?0.2:0.1; }
on(["s8-n","s8-x"],draw); LAB.$("#s8-t").addEventListener("change",draw); draw();
})();

<script>
/* M5: friction and inclined planes */
(()=>{

lesson({id:"m5",group:"b",num:5,lvl:"Mechanics · Lesson 5",name:"Friction and inclined planes",icon:"incline",
 eyebrow:eb("Mechanics · Forces and Newton's laws",5),title:"Resolving forces, friction and motion on inclined planes",
 intro:"Resolve forces into perpendicular components, usually parallel and perpendicular to the direction of motion. Friction opposes motion and satisfies F ≤ μR, with F = μR when sliding or in limiting equilibrium. On a slope at angle θ, the weight has components mg sin θ down the slope and mg cos θ into it.",
 outcomes:[["Resolve forces in 2 dimensions; equilibrium of a particle under coplanar forces","8.5"],["Understand and use addition of forces; resultant forces; dynamics for motion in a plane","8.5"],["Understand and use the F ≤ μR model for friction; coefficient of friction; motion of a body on a rough surface; limiting friction and statics","8.6"]],
 blocks:[
  B.text("Resolving on a slope",`<div class="formula">Perpendicular: R = mg cos θ (+ any other perpendicular components)<br>Parallel: resultant = ma;   friction F = μR when sliding</div>`+tech("Method",["Draw a clear force diagram: weight, normal reaction, friction, applied forces.","Resolve perpendicular to the plane to find R.","Use F = μR if moving or on the point of moving.","Resolve parallel: resultant force = ma (or = 0 in equilibrium)."])+`<p>On a rough slope with no other forces, a block is on the point of slipping when tan θ = μ.</p>`),
  B.sim("m5-sim","Block on a rough slope",`<div class="amwrap"><svg id="m5-svg" class="amplot" viewBox="0 0 520 300" role="img" aria-label="Block on inclined plane"></svg><p class="note" id="m5-note"></p></div>`,sl("m5-t","angle θ (°)",5,60,1,30)+sl("m5-mu","coefficient μ",0,1,0.05,0.2)+sl("m5-m","mass m (kg)",1,10,1,2)+ro([["m5-w","mg sin θ"],["m5-f","Max friction μR"],["m5-a","Acceleration"]]),`<span>Released from rest; arrows: weight (grey), reaction (blue), friction (green)</span>`),
  hand("Pulled on a rough floor","A 5 kg box on rough horizontal ground (μ = 0.3) is pulled by a force of 30 N at 20° above the horizontal. Find its acceleration.",[
   ["vertical: R + 30 sin 20° = 5g ⇒ R = 49 − 10.26 = 38.74 N",""],
   ["F = 0.3 × 38.74 = 11.62 N",""],
   {m:"5a = 30 cos 20° − 11.62 = 16.57 ⇒ a = 3.31 m s⁻²",ans:true}]),
  hand("Sliding down a slope","A 2 kg block slides down a rough plane inclined at 30° (μ = 0.2). Find its acceleration.",[
   ["R = 2g cos 30° = 16.97 N, F = 0.2R = 3.39 N",""],
   ["2a = 2g sin 30° − 3.39 = 9.8 − 3.39",""],
   {m:"a = 3.20 m s⁻²",ans:true}]),
  fill("",[
   {q:"A 4 kg block rests on a horizontal surface with μ = 0.5. Maximum friction:",lines:["[[19.6]] N"],why:"0.5 × 4g."},

function draw(){ const td=val("m5-t"), mu=val("m5-mu"), m=val("m5-m"), t=td*Math.PI/180; set("m5-t-l",td+"°"); set("m5-mu-l",r(mu,2)); set("m5-m-l",m);

  const bc=[cx+nx*s/2,cy+ny*s/2], ar=(x,y,X,Y,c)=>`<line x1="${x}" y1="${y}" x2="${X}" y2="${Y}" stroke="${c}" stroke-width="3"/><circle cx="${X}" cy="${Y}" r="4" fill="${c}"/>`;
  let sv=`<polygon points="${x0},${y0} ${x1},${y0} ${x1},${y1}" class="f4" opacity=".25"/><line class="ax" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>`;
  sv+=`<g transform="rotate(${-ang*180/Math.PI} ${cx} ${cy})"><rect x="${cx-s/2}" y="${cy-s}" width="${s}" height="${s}" class="f0" rx="4"/></g>`;
  sv+=ar(bc[0],bc[1],bc[0],bc[1]+70,"var(--muted)")+ar(bc[0],bc[1],bc[0]+nx*60,bc[1]+ny*60,"var(--data)")+(Fm>0?ar(bc[0],bc[1],bc[0]+dx*Math.min(70,20+Fm*2),bc[1]+dy*Math.min(70,20+Fm*2),"var(--good)"):"");
  sv+=`<text class="lab" x="${x1-60}" y="${y0-10}">θ = ${td}°</text>`;
  LAB.$("#m5-svg").innerHTML=sv; set("m5-w",r(W,2)+" N"); set("m5-f",r(Fm,2)+" N"); set("m5-a",r(a,3)+" m s⁻²");
  set("m5-note",W>Fm?`mg sin θ > μR: the block slides with a = g sin θ − μg cos θ = ${r(a,3)} m s⁻².`:`mg sin θ ≤ μR: friction ${r(W,2)} N holds the block at rest${Math.abs(W-Fm)<0.05?" (limiting equilibrium)":""}. Slipping starts at θ = ${r(Math.atan(mu)*180/Math.PI,1)}°.`); }

<script>
/* M7: statics and further forces */
(()=>{
const {B,lesson}=LEARN, {hand,tech,fill}=M, {eb,fr,sq,sup,sl,ro,val,set,on,r}=AM;

lesson({id:"m7",group:"b",num:6,lvl:"Mechanics · Lesson 6",name:"Statics and equilibrium",icon:"force",
 eyebrow:eb("Mechanics · Forces and Newton's laws",6),title:"Particles in equilibrium, resultants and ladders",
 intro:"A particle is in equilibrium when the resultant force is zero: resolve in two perpendicular directions and set each total to zero. For rigid bodies such as ladders, also take moments. Limiting equilibrium means friction has reached μR.",
 outcomes:[["Resolve forces in 2 dimensions; equilibrium of a particle under coplanar forces","8.5"],["Understand and use addition of forces; resultant forces; statics","8.5"],["Understand and use the F ≤ μR model for friction; coefficient of friction; limiting friction and statics","8.6"],["Understand and use moments in simple static contexts, including rigid bodies in equilibrium (ladders)","9.1"]],
 blocks:[
  B.text("Equilibrium",tech("Particle",["Resolve horizontally and vertically (or along convenient perpendicular axes).","Each resolved total = 0.","Alternatively draw a triangle of forces and use the sine rule."])+tech("Resultants",["Add components: R = (ΣX)i + (ΣY)j.","Magnitude √(ΣX² + ΣY²); direction tan⁻¹(ΣY/ΣX)."])+tech("Ladders",["Smooth wall: reaction perpendicular to the wall, no friction.","Rough ground: normal reaction R and friction F ≤ μR.","Take moments about the foot of the ladder."])),
  B.sim("m7-sim","Mass hanging from two strings",`<div class="amwrap"><svg id="m7-svg" class="amplot" viewBox="0 0 520 280" role="img" aria-label="Two strings supporting a mass"></svg><p class="note" id="m7-note"></p></div>`,sl("m7-a","left angle α to horizontal (°)",10,80,1,30)+sl("m7-b","right angle β to horizontal (°)",10,80,1,60)+sl("m7-m","mass (kg)",1,10,0.5,5)+ro([["m7-t1","Left tension T₁"],["m7-t2","Right tension T₂"]]),`<span>Resolving horizontally and vertically at the knot</span>`),
  hand("Two strings","A 5 kg mass hangs from two strings at 30° and 60° to the horizontal. Find the tensions.",[
   ["horizontal: T₁ cos 30° = T₂ cos 60° ⇒ T₂ = √3 T₁",""],
   ["vertical: T₁ sin 30° + T₂ sin 60° = 5g ⇒ 2T₁ = 49",""],
   {m:"T₁ = 24.5 N, T₂ = 42.4 N",ans:true}]),
  hand("Ladder","A uniform ladder of mass 15 kg and length 4 m rests against a smooth wall at 60° to rough horizontal ground. Find the least μ for equilibrium.",[
   ["vertical: R = 15g = 147 N; horizontal: F = S",""],
   ["moments about foot: S × 4 sin 60° = 15g × 2 cos 60° ⇒ S = 42.4 N",""],
   {m:"F ≤ μR ⇒ μ ≥ 42.4/147 = 0.289",ans:true}]),
  hand("Resultant","Forces (3i + 4j) N, (−5i + 2j) N and (6i − j) N act on a particle. Find the magnitude and direction of the resultant.",[
   ["R = 4i + 5j",""],
   {m:"|R| = √41 = 6.40 N at 51.3° above i",ans:true}]),

   {q:"A particle is in equilibrium under 3 forces; two are 4i and −3j. The third is …",opts:["−4i + 3j","4i − 3j","−4i − 3j","3i + 4j"],a:0},
   {q:"A mass hangs from two strings each at 45° to the horizontal; weight 20 N. Each tension (3 s.f.)?",a:14.1,tol:0.003},

   {q:"In equilibrium, the resultant force is …",opts:["mg","zero","μR","ma"],a:1}]),

function draw(){ const ad=val("m7-a"), bd=val("m7-b"), m=val("m7-m"), a=ad*Math.PI/180, b=bd*Math.PI/180; set("m7-a-l",ad+"°"); set("m7-b-l",bd+"°"); set("m7-m-l",r(m,1));
  const W=m*g, T1=W*Math.cos(b)/Math.sin(a+b), T2=W*Math.cos(a)/Math.sin(a+b);

  LAB.$("#m7-svg").innerHTML=s; set("m7-t1",r(T1,2)+" N"); set("m7-t2",r(T2,2)+" N"); set("m7-note",`T₁ cos α = T₂ cos β and T₁ sin α + T₂ sin β = ${r(W,1)} N. The steeper string carries more of the weight.`); }

<script>

function merge(a,b){ a=a||{}; b=b||{}; const out={...b,...a};
  const D="learn-motion-done"; if(a[D]||b[D]) out[D]=[...new Set([...(b[D]||[]),...(a[D]||[])])];
  const C="learn-check-state", rank={ok:3,shown:2,no:1}; if(a[C]||b[C]){ const m={...(b[C]||{})}; Object.entries(a[C]||{}).forEach(([k,v])=>{ if(!m[k]||(rank[v]||0)>(rank[m[k]]||0)) m[k]=v; }); out[C]=m; }
  const E="learn-motion-exam"; if(a[E]||b[E]){ const sc=s=>!s||!s.done?-1:(s.t?s.t.filter(Boolean).length:0)+(+s.v||0)+(s.c!=null?1:0); const m={...(b[E]||{})};
    Object.entries(a[E]||{}).forEach(([k,v])=>{ const w=m[k]; if(!w||sc(v)>sc(w)||(sc(v)===sc(w)&&(v.w||"").length>(w.w||"").length)) m[k]=v; }); out[E]=m; }
  const A="alp-activity"; if(a[A]||b[A]){ const x=a[A]||{}, y=b[A]||{}, r={time:{},first:{},last:{},days:[]};
    new Set([...Object.keys(x.time||{}),...Object.keys(y.time||{})]).forEach(id=>{ r.time[id]=Math.max((x.time||{})[id]||0,(y.time||{})[id]||0);
      const f=[(x.first||{})[id],(y.first||{})[id]].filter(Boolean).sort(); if(f[0]) r.first[id]=f[0];
      const l=[(x.last||{})[id],(y.last||{})[id]].filter(Boolean).sort(); if(l.length) r.last[id]=l[l.length-1]; });
    r.days=[...new Set([...(x.days||[]),...(y.days||[])])].sort(); out[A]=r; }
  const plain=o=>o&&typeof o==="object"&&!Array.isArray(o);
  Object.keys(out).forEach(k=>{ if(SPECIAL.has(k)||!(k in a)||!(k in b)) return;
    if(plain(a[k])&&plain(b[k])) out[k]={...b[k],...a[k]}; else if(Array.isArray(a[k])&&Array.isArray(b[k])) out[k]=a[k].length>=b[k].length?a[k]:b[k]; });
  return out; }

store.set=(k,v)=>{ origSet(k,v); if(user&&isSync(k)){ dirty=true; if(!pushT) pushT=setTimeout(()=>{ pushT=null; push(); },4000); } };
async function push(){ if(!user||!dirty) return; dirty=false; const data=gather();
  const {error}=await sb.from("progress").upsert({user_id:user.id,site:SITE,data,updated_at:new Date().toISOString()},{onConflict:"user_id,site"});
  if(error){ dirty=true; showSync("Not saved yet: will retry"); } else { lastSync=new Date(); showSync(); } }
setInterval(()=>{ if(dirty) push(); },60000);
window.addEventListener("pagehide",()=>{ if(dirty) push(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&dirty) push(); });

async function pull(){ const {data,error}=await sb.from("progress").select("data,updated_at").eq("user_id",user.id).eq("site",SITE).maybeSingle();
  if(error) return false; const server=(data&&data.data)||{}; const owner=raw.get(OWNER);
  const local=owner&&owner!==user.id?{}:gather(); const merged=merge(local,server);
  const changedLocal=JSON.stringify(sortDeep(merged))!==JSON.stringify(sortDeep(gather()))||owner!==user.id;
  if(JSON.stringify(sortDeep(merged))!==JSON.stringify(sortDeep(server))){ await sb.from("progress").upsert({user_id:user.id,site:SITE,data:merged,updated_at:new Date().toISOString()},{onConflict:"user_id,site"}); }
  writeAll(merged); raw.set(OWNER,user.id); lastSync=new Date();
  return changedLocal; }
function sortDeep(o){ if(Array.isArray(o)) return o.map(sortDeep); if(o&&typeof o==="object"){ const r={}; Object.keys(o).sort().forEach(k=>r[k]=sortDeep(o[k])); return r; } return o; }

  const pr=PAPERS.map(x=>{ const q=S.paper[x.id]; return `<tr><td>${esc(x.set?x.set+" · ":"")}${esc(x.name)}</td><td class="num">${q?`${q.g} / ${q.m}`:"–"}</td><td class="num">${q?pcell(q.g,q.m):"<span class=\"muted\">not started</span>"}</td></tr>`; }).join("");
  const opts=classes.filter(c=>c.id!==cur).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
  $("#td-d").innerHTML=`<div class="lcard"><h3>${esc(s.display_name||s.username)} <span class="muted" style="font-weight:400;font-size:.95rem">${esc(s.username)} · ${S.days} day${S.days===1?"":"s"} active · ${hm(S.time)}</span></h3>
   <div class="td-two"><div class="tbl-wrap"><table class="tbl-mini"><tr><th>Unit</th><th>Lessons</th><th>Checks</th><th>Exam Qs</th></tr>${ur}</table></div><div class="tbl-wrap"><table class="tbl-mini"><tr><th>Full paper</th><th>Marks</th><th>Score</th></tr>${pr}</table></div></div>
   <div class="td-actions" style="margin-top:14px"><button class="btn" id="td-pw">Reset password</button>${opts?`<select id="td-mv" aria-label="Move to class"><option value="">Move to class…</option>${opts}</select>`:""}<button class="btn" id="td-out">Remove from class</button><button class="btn" id="td-rm">Delete account</button></div></div>`;
  $("#td-d").scrollIntoView({behavior:"smooth",block:"nearest"}); }
td.addEventListener("click",async e=>{ const t=e.target;
  if(t.closest("#td-x")){ closeDash(); return; }
  if(t.closest("#td-ref")){ await loadClasses(); renderDash(); return; }
  const cb=t.closest("[data-c]"); if(cb){ cur=cb.dataset.c; sel=null; await loadStudents(); renderDash(); return; }
  const tr=t.closest("tr[data-s]"); if(tr){ detail(tr.dataset.s); return; }
  if(t.closest("#td-csv")){ csv(); return; }
  if(t.closest("#td-del-c")){ const c=classes.find(x=>x.id===cur); if(!confirm(`Delete the class “${c.name}”? Students keep their accounts and progress but leave the class.`)) return; const {error}=await sb.from("classes").delete().eq("id",cur); if(error){ alert(error.message); return; } cur=null; sel=null; await loadClasses(); renderDash(); return; }
  if(t.closest("#td-pw")){ const np=prompt("New password for this student (at least 6 characters). Tell them the new password; they can keep using it."); if(!np) return; const {error}=await sb.rpc("reset_student_password",{student:sel,new_password:np}); alert(error?("Not changed: "+error.message):"Password changed."); return; }
  if(t.closest("#td-out")){ const s=students.find(x=>x.id===sel); if(!confirm(`Remove ${s.display_name||s.username} from this class? Their account and progress are kept.`)) return; const {error}=await sb.rpc("remove_from_class",{student:sel,from_class:cur}); if(error){ alert(error.message); return; } sel=null; await loadStudents(); renderDash(); return; }
  if(t.closest("#td-rm")){ const s=students.find(x=>x.id===sel); if(!confirm(`Permanently delete ${s.display_name||s.username}'s account and all their progress on every site?`)) return; const {error}=await sb.rpc("delete_student",{student:sel}); if(error){ alert(error.message); return; } sel=null; await loadStudents(); renderDash(); return; } });
td.addEventListener("change",async e=>{ if(e.target.id==="td-mv"&&e.target.value){ const {error}=await sb.rpc("move_student",{student:sel,from_class:cur,to_class:e.target.value}); if(error){ alert(error.message); return; } sel=null; await loadStudents(); renderDash(); } });
td.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const tr=e.target.closest("tr[data-s]"); if(tr) detail(tr.dataset.s); } if(e.key==="Escape") closeDash(); });
td.addEventListener("submit",async e=>{ if(e.target.id!=="td-nf") return; e.preventDefault(); const n=e.target.elements.n.value.trim(); if(!n) return; const {data,error}=await sb.rpc("create_class",{class_name:n,for_site:SITE}); if(error){ alert(error.message); return; } cur=(Array.isArray(data)?data[0]:data).id; sel=null; await loadClasses(); renderDash(); });
function csv(){ const c=classes.find(x=>x.id===cur); const head=["Name","Username","Last saved","Lessons done","Lessons total","Check questions right","Check questions total","Lesson exam marks","Lesson exam marks attempted",...PAPERS.flatMap(p=>{ const n=(p.set?p.set+" · ":"")+p.name; return [`${n} marks`,`${n} attempted`]; }),"Minutes"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[head.map(q).join(",")].concat(students.map(s=>{ const p=prog[s.id]||{st:stats({})}, S=p.st; return [s.display_name||"",s.username,p.updated?new Date(p.updated).toISOString().slice(0,10):"",S.done,lessons.length,S.cok,S.cq,S.em,S.emk,...PAPERS.flatMap(x=>S.paper[x.id]?[S.paper[x.id].g,S.paper[x.id].m]:["",""]),Math.round(S.time/60)].map(q).join(","); }));
  const url=URL.createObjectURL(new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv"})); const a=document.createElement("a"); a.href=url; a.download=`${SITE}_${(c?c.name:"class").replace(/[^\w-]+/g,"_")}_progress.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); }

/* ---------- start ---------- */
(async()=>{ const {data:{session}}=await sb.auth.getSession(); if(session){ await afterSignIn(false); }
  else { renderMenu(); let guest=false; try{ guest=sessionStorage.getItem("alp-guest")==="1"; }catch(_){} if(!guest) openAuth("in"); } })();
window.ALP_ACCOUNTS={sb,merge,stats,get user(){ return user; }};
})();
</script>

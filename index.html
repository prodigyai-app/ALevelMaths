<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="numeric-tools.js"></script>
<title>A Level Maths</title>
<meta name="description" content="Edexcel A Level Mathematics (9MA0): interactive lessons, worked examples, topic tests and full practice papers for Pure, Statistics and Mechanics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: practical switcher, then each lab = live apparatus stage beside a control panel, with results and worked solutions underneath */
:root{
  --bg:#e9edee; --panel:#fbfcfc; --sunk:#dfe5e7; --ink:#162024; --muted:#54636a; --line:#cbd5d9;
  --accent:#c4531a; --accent-soft:#f6e3d8; --on-accent:#ffffff; --data:#1b6788; --good:#2c7a4c; --bad:#b1352a;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101619; --panel:#172024; --sunk:#0c1214; --ink:#e4eaec; --muted:#93a2a9; --line:#2a373c;
  --accent:#ee8346; --accent-soft:#3a2418; --on-accent:#1a0e07; --data:#62b4d3; --good:#5fc08a; --bad:#f07a6c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101619; --panel:#172024; --sunk:#0c1214; --ink:#e4eaec; --muted:#93a2a9; --line:#2a373c;
  --accent:#ee8346; --accent-soft:#3a2418; --on-accent:#1a0e07; --data:#62b4d3; --good:#5fc08a; --bad:#f07a6c; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);font-stretch:82%;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(1.45rem,2.8vw,1.95rem);font-weight:750}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand{display:flex;gap:14px;align-items:center}
.brand svg{flex:none}
.brand p{color:var(--muted);font-size:.95rem}
.switcher{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.prac{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);transition:border-color .15s}
.prac:hover{border-color:var(--muted)}
.prac:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.prac[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.prac .ico{grid-row:span 2;width:40px;height:40px;border-radius:8px;background:var(--sunk);display:grid;place-items:center}
.prac .lvl{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prac .nm{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.08rem;line-height:1.15}

/* lab layout */
.lab{display:flex;flex-direction:column;gap:18px}
.lab-head{display:flex;flex-direction:column;gap:6px;max-width:70ch}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:960px){.bench{grid-template-columns:minmax(0,1fr)}}
.stage{border-radius:var(--r);overflow:hidden;background:#1d2224;box-shadow:0 1px 0 rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.35);position:relative;min-width:0}
.stage svg,.stage canvas{display:block;width:100%;height:auto}
.stage-bar{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;background:#15191b;color:#c9d2d5;font-family:var(--f-mono);font-size:.74rem}
.stage-bar b{color:#fff;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.field{display:flex;flex-direction:column;gap:7px}
.lbl{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.lbl i,.lbl output i{text-transform:none;font-family:Georgia,serif;font-size:1.1em}
.lbl output{color:var(--ink);font-weight:600;letter-spacing:0;text-transform:none}
.seg{display:grid;gap:6px}
.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.c1{grid-template-columns:minmax(0,1fr)}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;pointer-events:none}
.opt span{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:.88rem;line-height:1.2;min-height:38px;background:var(--panel)}
.opt input:checked + span{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px}
.opt input:disabled + span{opacity:.45;cursor:not-allowed}
.sw{width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
select,input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:38px}
input[type=number]{width:84px;font-family:var(--f-mono);font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--accent)}
.slider{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;align-items:center}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.check input{accent-color:var(--accent);width:17px;height:17px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:1rem}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.step-tag{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.readout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.readout div{background:var(--sunk);padding:7px 10px;display:flex;flex-direction:column}
.readout span{font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.readout b{font-family:var(--f-mono);font-size:1.05rem;font-variant-numeric:tabular-nums;font-weight:600}
.readout.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:520px){.readout.c5{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* lower area */
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.lower{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.02em;color:var(--muted);font-weight:600;text-align:right}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--f-mono);font-size:.86rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.empty{color:var(--muted);font-size:.92rem;padding:10px 0}
.results-tables{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px}
@media (max-width:620px){.results-tables{grid-template-columns:minmax(0,1fr)}}
.graph{width:100%;height:auto;display:block;border-radius:8px;background:var(--sunk)}
details{border-top:1px solid var(--line);padding-top:10px}
details:first-of-type{border-top:0;padding-top:0}
summary{cursor:pointer;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-mono);color:var(--muted);font-weight:400}
details[open] summary::after{content:"−"}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:8px;padding-top:8px;font-size:.96rem}
.prose ol,.prose ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.vars{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.vars dt{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:3px}
.vars dd{margin:0}
.ans{background:var(--sunk);border-radius:8px;padding:8px 12px}

/* worked solution */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chip{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:2px}
.chip span{font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.chip b{font-family:var(--f-mono);font-size:1.1rem;font-variant-numeric:tabular-nums}
.chip.key{border-color:var(--accent);background:var(--accent-soft)}
.work{display:flex;flex-direction:column;gap:12px}
.wstep{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px}
.wstep .n{grid-row:span 3;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem}
.wstep h4{margin:4px 0 0;font-family:var(--f-display);font-stretch:85%;font-size:1.02rem}
.wstep .why{color:var(--muted);font-size:.92rem}
.eqs{display:flex;flex-direction:column;gap:6px;overflow-x:auto;padding:2px 0}
.eq{font-family:var(--f-mono);font-size:.9rem;display:flex;align-items:center;flex-wrap:nowrap;gap:.35em;white-space:nowrap}
.eq .tx{white-space:normal;min-width:0;flex:1 1 auto;line-height:1.5}
.eq i{font-family:"Times New Roman",Georgia,serif;font-size:1.12em}
.eq .res{background:var(--accent-soft);border:1px solid var(--accent);border-radius:5px;padding:0 6px;font-weight:600}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.25}
.fr > span{padding:0 3px}
.fr > span:first-child{border-bottom:1.5px solid currentColor}
.sq{display:inline-flex;align-items:flex-start}
.sq > span{border-top:1.5px solid currentColor;padding:1px 3px 0}
.veiled{position:relative}
.veiled > .veil-body{filter:blur(7px);user-select:none;pointer-events:none}
.veil-msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:16px;font-weight:600}
.veiled > .veil-msg{display:grid}
.veil-msg span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;max-width:34ch}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.preset{all:unset;cursor:pointer;border:1px dashed var(--line);border-radius:8px;padding:9px 12px;font-size:.92rem;line-height:1.35}
.preset:hover{border-color:var(--accent)}
.preset:focus-visible{outline:2px solid var(--accent)}
.preset b{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.pred{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pred label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.pred input{width:100%}
.pred-res{font-size:.92rem}
.ok{color:var(--good);font-weight:700}
.no{color:var(--bad);font-weight:700}

/* navigation groups */
.nav{display:flex;flex-direction:column;gap:14px}
.navgroup{display:flex;flex-direction:column;gap:8px}
.navgroup .switcher{grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.prac .ico{width:36px;height:36px;color:var(--ink)}
.prac[aria-selected="true"] .ico{background:var(--accent);color:var(--on-accent)}
/* revealable answers */
details.reveal{border:0;padding:0}
details.reveal summary{font-family:var(--f-mono);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);justify-content:flex-start;gap:6px}
details.reveal summary::after{content:""}
details.reveal summary::before{content:"▸"}
details.reveal[open] summary::before{content:"▾"}
details.reveal .ans{margin-top:6px}
/* tables */
td.xc{width:28px;padding:2px 4px}
button.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;padding:3px 6px;border-radius:5px}
button.x:hover{background:var(--sunk);color:var(--bad)}
.seg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.readout.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.readout.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.steps{display:flex;flex-direction:column;gap:6px}
.steps button{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:.9rem;line-height:1.25;min-height:40px}
.steps button .k{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.steps button.done{color:var(--muted)}
.steps button.done .k{background:var(--good);border-color:var(--good);color:#fff}
.steps button.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.steps button.next .k{border-color:var(--accent);color:var(--accent)}
.steps button:disabled{cursor:not-allowed;opacity:.55}
.schem{background:var(--sunk);border-radius:8px;padding:8px;display:flex;justify-content:center}
.schem svg{width:100%;max-width:300px;height:auto}
.schem svg *{stroke:var(--ink)}
.schem svg text{fill:var(--ink);stroke:none}
.note{font-size:.88rem;color:var(--muted)}
.warn{font-size:.88rem;color:var(--bad);font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.stage canvas{touch-action:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.listmode .navgroup .switcher{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.listmode .prac{grid-template-columns:auto 1fr;align-items:start;align-content:start;padding:14px 16px}
.listmode .prac .ico{grid-row:span 3}
.listmode .prac .desc{grid-column:2;font-size:.88rem;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.listmode .prac:hover{border-color:var(--accent)}
#list-intro{margin:-4px 0 14px}
.pnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:0 0 18px}
.pnav.bot{margin:22px 0 6px}
.pnav .btn{min-height:40px;padding:6px 14px;width:auto}
.pnav .pn-pos{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.pnav .pn-sp{flex:1}
.pnav .pn-t{display:inline-block;max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.pnav.top{position:sticky;top:0;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.06)}
@media (max-width:640px){.pnav.top{position:static}.pnav .pn-t{max-width:11ch}.pnav .pn-sp{display:none}.pnav .pn-pos{order:-1;flex-basis:100%}.pnav .pn-list{flex:1 1 100%}.pnav .pn-prev,.pnav .pn-next{flex:1 1 40%}.listmode .navgroup .switcher{grid-template-columns:1fr}}
</style><style>
/* ---------- learning pages ---------- */
.lsec{display:flex;flex-direction:column;gap:18px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.lcard>h3{font-size:1.25rem;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.lcard>h3 .kind{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);padding:3px 7px;border-radius:5px;font-weight:600;font-stretch:normal}
.lcard>h3 .kind.k-sim{background:var(--data);color:#fff}
.lcard>h3 .kind.k-ex{background:#6b4fa0;color:#fff}
.lcard>h3 .kind.k-chk{background:var(--good);color:#fff}
.lcard>h3 .kind.k-prac{background:#8a6234;color:#fff}
.prose{font-size:1.02rem;line-height:1.6}
.prose p{margin:0 0 .75em}.prose p:last-child{margin-bottom:0}
.prose ul,.prose ol{margin:.2em 0 .8em;padding-left:1.3em}.prose li{margin:.25em 0}
.prose b{font-weight:700}
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.fig{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.85rem;color:var(--muted);margin-top:6px;line-height:1.4}
.lo{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.lo li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:1rem}
.lo li::before{content:"";width:14px;height:14px;margin-top:4px;border:2px solid var(--accent);border-radius:4px}
.lo .ref{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-left:6px}
.eqbox{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.eqbox>div{font-family:var(--f-mono);font-size:1.02rem;background:var(--sunk);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 14px;display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
.eqbox>div small{font-family:var(--f-body);font-size:.8rem;color:var(--muted);margin-left:6px}
.kp{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.kp li{padding:8px 12px;border-radius:6px;background:var(--sunk);border-left:4px solid var(--good)}
.kp.kbad li{border-left-color:var(--bad)}
.kp li b{font-weight:700}
.ex .exq{font-size:1.02rem;padding:10px 14px;background:var(--sunk);border-radius:8px;margin-bottom:12px}
.ex .exs{display:flex;flex-direction:column;gap:10px}
.ex .exs .wstep[hidden]{display:none}
.ex .exbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ex .exbtns .btn{width:auto;min-height:38px;padding:6px 14px}
.qz{display:flex;flex-direction:column;gap:14px}
.qi{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg)}
.qi .qq{font-size:1rem;margin-bottom:10px}

/* thermometer: returns svg; setThermo(id,T) moves the column. visible scale from yTop+14 to yTop+scaleLen */
const thermoMap={};
C.thermo=(x,yTop,len,id,{tMin=-10,tMax=110,scaleLen=null}={})=>{
  const s0=yTop+14, s1=yTop+(scaleLen||len-40), k=(s1-s0)/(tMax-tMin), bot=yTop+len-12;
  thermoMap[id]={y:T=>s1-(T-tMin)*k,bot};
  let ticks=""; for(let T=tMin;T<=tMax;T++){ const y=(s1-(T-tMin)*k).toFixed(2), L=T%10===0?5.5:T%5===0?3.8:2.2;
    if(k<1.2&&T%5&&T%10) continue;
    ticks+=`<line x1="${x-2}" x2="${x-2+L}" y1="${y}" y2="${y}" stroke="#1d1d1d" stroke-width="${T%10===0?.55:.35}"/>`;
    if(T%20===0) ticks+=`<text x="${x+7}" y="${(+y+1.6).toFixed(2)}" font-size="4.4" text-anchor="end" font-family="Arial" fill="#1d1d1d">${T}</text>`; }
  return `<g><rect x="${x-8}" y="${yTop}" width="16" height="${len}" rx="8" fill="url(#g-thGlass)" stroke="#9fb6be" stroke-width=".6"/>
<rect x="${x-2}" y="${s0-4}" width="9" height="${s1-s0+8}" rx="1" fill="#f7f5ec" opacity=".95"/>${ticks}
<rect x="${x-4.6}" y="${yTop+6}" width="2.2" height="${len-12}" fill="#fff" opacity=".65"/>
<rect id="${id}" x="${x-4.4}" y="${s1}" width="1.8" height="${bot-s1}" fill="url(#g-red)"/>
<ellipse cx="${x}" cy="${bot+2}" rx="6.5" ry="11" fill="#d42a22" stroke="#8f1414" stroke-width=".8"/><ellipse cx="${x-2}" cy="${bot-2}" rx="2" ry="4.5" fill="#fff" opacity=".55"/>
<rect x="${x-6.5}" y="${yTop}" width="3" height="${len-10}" rx="1.5" fill="#fff" opacity=".45"/></g>`; };
function setThermo(id,T){ const m=thermoMap[id], el=document.getElementById(id); if(!m||!el) return; const y=m.y(T); el.setAttribute("y",y.toFixed(2)); el.setAttribute("height",Math.max(0,m.bot-y).toFixed(2)); return y; }

/* wooden rule. horizontal: from (x,y) length len px for cm cm; vertical if vert */
C.rule=(x,y,lenCm,px,{vert=false,w=26,label="",major=10,from=0}={})=>{ const L=lenCm*px; let t="";
  const mm=px>=7;
  for(let i=0;i<=lenCm*(mm?10:2);i++){ const cm=i/(mm?10:2), p=(cm*px).toFixed(2), isCm=Math.abs(cm-Math.round(cm))<1e-6, half=Math.abs(cm*2-Math.round(cm*2))<1e-6;
    const l=isCm?(Math.round(cm)%major===0?w*.5:w*.36):half?w*.26:w*.16;
    t+=vert?`<line x1="${x}" x2="${x+l}" y1="${y+ +p}" y2="${y+ +p}" stroke="#222" stroke-width="${isCm?.8:.5}"/>`:`<line x1="${x+ +p}" x2="${x+ +p}" y1="${y}" y2="${y+l}" stroke="#222" stroke-width="${isCm?.8:.5}"/>`;
    const step=px>=14?1:px>=6?5:10;
    if(isCm&&Math.round(cm)%step===0){ const v=Math.round(cm)+from; t+=vert?`<text x="${x+w*.62}" y="${y+ +p+3}" font-family="Arial" font-size="${Math.min(9,px*1.1+3)}" fill="#222">${v}</text>`:`<text x="${x+ +p}" y="${y+w*.86}" text-anchor="middle" font-family="Arial" font-size="${Math.min(9,px*1.1+3)}" fill="#222">${v}</text>`; } }
  return vert?`<rect x="${x-3}" y="${y-8}" width="${w}" height="${L+16}" fill="url(#g-woodV)" filter="url(#g-woodgrain)"/><rect x="${x-3}" y="${y-8}" width="${w}" height="${L+16}" fill="none" stroke="#9c7b45" stroke-width=".6"/>${t}${label?`<text x="${x+w*.5}" y="${y+L*.5}" font-family="Arial" font-size="6" fill="#6b4e1f" transform="rotate(90 ${x+w*.5} ${y+L*.5})" text-anchor="middle">${label}</text>`:""}`
   :`<rect x="${x-8}" y="${y-3}" width="${L+16}" height="${w}" fill="url(#g-wood)" filter="url(#g-woodgrain)"/><rect x="${x-8}" y="${y-3}" width="${L+16}" height="${w}" fill="none" stroke="#9c7b45" stroke-width=".6"/>${t}`; };

/* micrometer close-up card at (x,y), 350 x 124; r = reading in mm or null */
C.micro=(x,y,r,wireCol="#c8784a")=>{ const rr=r==null?0:r, x0=x+30, y0=y+46, sl=Math.floor(rr*2+1e-9)/2, th=(rr-sl)*100, tx=x0+164+rr*20;
  let tk=""; for(let k=-6;k<=6;k++){ const v=((Math.round(th)+k)%50+50)%50, yy=y0+(k-(th-Math.round(th)))*-6; tk+=`<line x1="${tx}" x2="${tx+(v%5===0?10:6)}" y1="${yy}" y2="${yy}" stroke="#222" stroke-width=".7"/>${v%5===0?`<text x="${tx+13}" y="${yy+2.5}" font-family="Arial" font-size="6" fill="#222">${v}</text>`:""}`; }
  let sc=""; for(let h=0;h<=Math.round(sl*2);h++){ const xx=x0+162+h*10; sc+=`<line x1="${xx}" x2="${xx}" y1="${h%2?y0:y0-6}" y2="${h%2?y0+6:y0}" stroke="#222" stroke-width=".8"/>${h%2===0?`<text x="${xx-2}" y="${y0-9}" font-family="Arial" font-size="6" fill="#222">${h/2}</text>`:""}`; }
  const sx=x0+66+rr*30;
  return `<rect x="${x}" y="${y}" width="350" height="140" rx="8" fill="#e9ecea" stroke="#9ea39c"/><text x="${x+12}" y="${y+16}" font-family="'JetBrains Mono',monospace" font-size="9" fill="#5b6268">MICROMETER · CLOSE-UP</text>
  <path d="M${x0+10} ${y0-8} Q${x0-10} ${y0-8} ${x0-10} ${y0+12} V${y0+36} Q${x0-10} ${y0+58} ${x0+20} ${y0+58} H${x0+110} Q${x0+136} ${y0+58} ${x0+136} ${y0+36} V${y0+12}" fill="none" stroke="#2c3135" stroke-width="16"/>

/* ---------------- canvas graph ---------------- */
function plot(cv,o){
  if(!cv||!cv.offsetParent) return null;
  const w=cv.clientWidth, h=Math.round(w*(o.aspect||.64)), dpr=window.devicePixelRatio||1;

  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  const ink=css("--ink"), mut=css("--muted"), line=css("--line"), panel=css("--panel"), mono=css("--f-mono");
  const S=(o.series||[]).filter(s=>s.pts&&s.pts.length);
  const all=S.flatMap(s=>s.pts);
  const rng=(ax,i)=>{ let lo=ax.min, hi=ax.max; const vals=all.map(p=>p[i]);
    if(lo==null) lo=vals.length?Math.min(...vals):(ax.def||[0,10])[0]; if(hi==null) hi=vals.length?Math.max(...vals):(ax.def||[0,10])[1];
    if(ax.zero!==false){ if(ax.min==null) lo=Math.min(0,lo); if(ax.max==null) hi=Math.max(0,hi); }
    if(hi-lo<1e-9){ hi=lo+(ax.span||1); }
    const st=nice(hi-lo,ax.n||6); if(ax.min==null) lo=Math.floor(lo/st+1e-9)*st; if(ax.max==null) hi=Math.ceil(hi/st-1e-9)*st; if(hi<=lo) hi=lo+st;
    return [lo,hi,nice(hi-lo,ax.n||6)]; };

  const X=v=>L+(v-x0)/(x1-x0)*pw, Y=v=>T+(y1-v)/(y1-y0)*ph;
  const dec=st=>Math.max(0,-Math.floor(Math.log10(st)+1e-9));

  for(let v=x0;v<=x1+xs*1e-6;v+=xs/5){ c.strokeStyle=line; c.globalAlpha=Math.abs(((v-x0)/xs)-Math.round((v-x0)/xs))<1e-6?1:.45; c.beginPath(); c.moveTo(Math.round(X(v))+.5,T); c.lineTo(Math.round(X(v))+.5,T+ph); c.stroke(); }
  for(let v=y0;v<=y1+ys*1e-6;v+=ys/5){ c.strokeStyle=line; c.globalAlpha=Math.abs(((v-y0)/ys)-Math.round((v-y0)/ys))<1e-6?1:.45; c.beginPath(); c.moveTo(L,Math.round(Y(v))+.5); c.lineTo(L+pw,Math.round(Y(v))+.5); c.stroke(); }
  c.globalAlpha=1; c.strokeStyle=mut; c.lineWidth=1.4;

  c.fillStyle=mut; c.font=`11.5px ${mono}`; c.textAlign="center"; c.textBaseline="top";
  for(let v=x0;v<=x1+xs*1e-6;v+=xs) c.fillText((Math.abs(v)<xs*1e-6?0:v).toFixed(dec(xs)),X(v),T+ph+6);
  c.fillText(o.x.label,L+pw/2,T+ph+24);
  c.textAlign="right"; c.textBaseline="middle";
  for(let v=y0;v<=y1+ys*1e-6;v+=ys) c.fillText((Math.abs(v)<ys*1e-6?0:v).toFixed(dec(ys)),L-6,Y(v));
  c.save(); c.translate(13,T+ph/2); c.rotate(-Math.PI/2); c.textAlign="center"; c.fillText(o.y.label,0,0); c.restore();
  if(!S.length&&!(o.fits||[]).length){ c.textAlign="center"; const msg=o.empty||"Readings will be plotted here"; if(c.measureText(msg).width>pw-16){ const w=msg.split(" "), h=Math.ceil(w.length/2); c.fillText(w.slice(0,h).join(" "),L+pw/2,T+ph/2-8); c.fillText(w.slice(h).join(" "),L+pw/2,T+ph/2+8); } else c.fillText(msg,L+pw/2,T+ph/2); return null; }
  c.save(); c.beginPath(); c.rect(L,T,pw,ph); c.clip();
  (o.fits||[]).forEach(f=>{ c.strokeStyle=f.col||ink; c.lineWidth=1.6; c.globalAlpha=.9; c.setLineDash(f.dash||[]); c.beginPath();
    if(f.fn){ for(let i=0;i<=120;i++){ const xv=f.x0+(f.x1-f.x0)*i/120; const yv=f.fn(xv); i?c.lineTo(X(xv),Y(yv)):c.moveTo(X(xv),Y(yv)); } }
    else { c.moveTo(X(f.x0),Y(f.m*f.x0+f.c)); c.lineTo(X(f.x1),Y(f.m*f.x1+f.c)); }
    c.stroke(); c.setLineDash([]); c.globalAlpha=1; });
  if(o.tri){ const t=o.tri, ya=t.m*t.xa+t.c, yb=t.m*t.xb+t.c; c.strokeStyle=css("--data"); c.fillStyle=css("--data"); c.lineWidth=1.3; c.setLineDash([5,4]);
    c.beginPath(); c.moveTo(X(t.xa),Y(ya)); c.lineTo(X(t.xb),Y(ya)); c.lineTo(X(t.xb),Y(yb)); c.stroke(); c.setLineDash([]);
    c.font=`600 11px ${mono}`; c.textAlign="center"; c.textBaseline="top"; c.fillText(t.dxl||"Δx",(X(t.xa)+X(t.xb))/2,Y(ya)+(yb>ya?4:-16));
    const dw=c.measureText(t.dyl||"Δy").width; const right=X(t.xb)+8+dw<L+pw; c.textAlign=right?"left":"right"; c.textBaseline="middle"; c.fillText(t.dyl||"Δy",X(t.xb)+(right?5:-5),(Y(ya)+Y(yb))/2); }
  S.forEach(s=>{
    const pts=s.sort===false?s.pts:s.pts.slice().sort((a,b)=>a[0]-b[0]);

      P.forEach((p,i)=>{ if(!i){ c.moveTo(p[0],p[1]); return; } if(s.join!=="curve"){ c.lineTo(p[0],p[1]); return; }
        const p0=P[i-2]||P[i-1], p1=P[i-1], p3=P[i+1]||p; c.bezierCurveTo(p1[0]+(p[0]-p0[0])/6,p1[1]+(p[1]-p0[1])/6,p[0]-(p3[0]-p1[0])/6,p[1]-(p3[1]-p1[1])/6,p[0],p[1]); });
      c.stroke(); c.globalAlpha=1; }
    c.strokeStyle=s.col; c.lineWidth=1.7;
    if(s.ey||s.ex){ c.lineWidth=1.1; c.globalAlpha=.75; s.pts.forEach(([xv,yv],i)=>{ const x=X(xv),y=Y(yv), ey=s.ey?(Array.isArray(s.ey)?s.ey[i]:s.ey):0, ex=s.ex?(Array.isArray(s.ex)?s.ex[i]:s.ex):0;
      if(ey){ const y1=Y(yv+ey), y2=Y(yv-ey); c.beginPath(); c.moveTo(x,y1); c.lineTo(x,y2); c.moveTo(x-4,y1); c.lineTo(x+4,y1); c.moveTo(x-4,y2); c.lineTo(x+4,y2); c.stroke(); }
      if(ex){ const x1=X(xv-ex), x2=X(xv+ex); c.beginPath(); c.moveTo(x1,y); c.lineTo(x2,y); c.moveTo(x1,y-4); c.lineTo(x1,y+4); c.moveTo(x2,y-4); c.lineTo(x2,y+4); c.stroke(); } }); c.globalAlpha=1; c.lineWidth=1.7; }
    if(!s.noPts) s.pts.forEach(([xv,yv],i)=>{ const x=X(xv),y=Y(yv),k=3.8; const hl=s.mark&&s.mark[i]; c.globalAlpha=hl?.35:1; c.beginPath(); c.moveTo(x-k,y-k); c.lineTo(x+k,y+k); c.moveTo(x+k,y-k); c.lineTo(x-k,y+k); c.stroke(); if(hl){ c.beginPath(); c.arc(x,y,7,0,Math.PI*2); c.stroke(); } c.globalAlpha=1; });
  });
  c.restore();
  const lab=S.filter(s=>s.label).concat((o.fits||[]).filter(f=>f.label).map(f=>({label:f.label,col:f.col||ink,line:true})));
  if(lab.length){ c.textAlign="left"; c.textBaseline="middle"; c.font=`11px ${css("--f-body")}`; let ly=T+10;

  return {X,Y,x0,x1,y0,y1};
}
/* simple bar chart: items [{label, v, ref, col}] */
function bars(cv,o){
  if(!cv||!cv.offsetParent) return;
  const w=cv.clientWidth, h=Math.round(w*(o.aspect||.64)), dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  const ink=css("--ink"), mut=css("--muted"), line=css("--line"), mono=css("--f-mono");
  const it=o.items||[]; const L=58,R=14,T=16,B=58, pw=w-L-R, ph=h-T-B;
  const vmax=Math.max(o.ymin||1,...it.map(i=>Math.max(i.v,i.ref||0)))*1.1, st=nice(vmax,5), top=Math.ceil(vmax/st)*st;
  const Y=v=>T+ph-v/top*ph;
  c.font=`11.5px ${mono}`; c.textAlign="right"; c.textBaseline="middle";
  for(let v=0;v<=top+1e-9;v+=st){ c.strokeStyle=line; c.lineWidth=1; c.beginPath(); c.moveTo(L,Math.round(Y(v))+.5); c.lineTo(L+pw,Math.round(Y(v))+.5); c.stroke(); c.fillStyle=mut; c.fillText(v.toFixed(Math.max(0,-Math.floor(Math.log10(st)))),L-6,Y(v)); }
  c.save(); c.translate(13,T+ph/2); c.rotate(-Math.PI/2); c.textAlign="center"; c.fillText(o.ylabel,0,0); c.restore();
  if(!it.length){ c.textAlign="center"; c.fillText(o.empty||"Results will appear here",L+pw/2,T+ph/2); return; }
  const bw=Math.min(64,pw/it.length*.6), gap=pw/it.length;
  it.forEach((i,k)=>{ const cx=L+gap*(k+.5); c.fillStyle=i.col||css("--accent"); c.globalAlpha=.85; c.fillRect(cx-bw/2,Y(i.v),bw,T+ph-Y(i.v)); c.globalAlpha=1;
    c.fillStyle=ink; c.textAlign="center"; c.textBaseline="bottom"; c.font=`600 11px ${mono}`; c.fillText(i.vl??fmt(i.v),cx,Y(i.v)-3);
    if(i.ref!=null){ c.strokeStyle=ink; c.lineWidth=2; c.setLineDash([4,3]); c.beginPath(); c.moveTo(cx-bw/2-6,Y(i.ref)); c.lineTo(cx+bw/2+6,Y(i.ref)); c.stroke(); c.setLineDash([]); }

  c.strokeStyle=mut; c.lineWidth=1.4; c.beginPath(); c.moveTo(L,T); c.lineTo(L,T+ph); c.lineTo(L+pw,T+ph); c.stroke();
  if(o.refLabel&&it.some(i=>i.ref!=null)){ c.font=`11px ${css("--f-body")}`; c.textAlign="right"; c.textBaseline="middle"; c.fillStyle=ink; c.fillText(o.refLabel,L+pw-4,T+8); c.strokeStyle=ink; c.setLineDash([4,3]); c.lineWidth=2; const tw=c.measureText(o.refLabel).width; c.beginPath(); c.moveTo(L+pw-tw-28,T+8); c.lineTo(L+pw-tw-10,T+8); c.stroke(); c.setLineDash([]); }
}

<script>

 example:(title,q,steps)=>{ const id="ex"+(++qid); return `<div class="lcard ex" id="${id}"><h3>${kind("k-ex","Worked example")}${title}</h3><div class="exq">${q}</div><div class="exs">${steps.map(([t,why,eqs],i)=>W.step(i+1,t,why,eqs).replace('<div class="wstep"',`<div class="wstep" ${i?"hidden":""}`)).join("")}</div><div class="exbtns"><button class="btn primary" data-exnext="${id}">Show next step</button><button class="btn" data-exall="${id}">Show all steps</button></div></div>`; },

  return `<div class="lcard" id="${id}"><h3>${kind("k-chk","Check")}${title} <span class="qscore" id="${id}-score"></span></h3><div class="qz">${qs.map((q,i)=>{ const n=`${id}-${i}`;

const QZ={}, STATE={};

let restored=false;

function grade(qid){ const [id,i]=qid.split(/-(?=\d+$)/), q=QZ[id][+i], fb=$(`#${qid}-fb`); let ok=false, ans;

<script>
/* Exam-style questions: self-marked against OCR-style mark schemes */
window.EXAM=(()=>{
const {$,$$,store}=LAB, {num}=LEARN;
const KEY="learn-motion-exam", saved=store.get(KEY)||{};
const save=()=>store.set(KEY,saved);
const CARDS={}, PARTS={};
const kind=`<span class="kind k-exam">Exam</span>`;
const L="abcdefghij";

/* simple graph for question figures */
function graph(o){ const w=o.w||440,h=o.h||270,ml=52,mr=14,mt=14,mb=46,pw=w-ml-mr,ph=h-mt-mb,y0=o.ymin||0;
  const X=x=>ml+x/o.xmax*pw, Y=y=>mt+(o.ymax-y)/(o.ymax-y0)*ph; let g="";
  for(let x=0;x<=o.xmax+1e-9;x+=o.xs){ const lab=Math.round(x/o.xs)%(o.xl||1)===0; g+=`<line x1="${X(x)}" y1="${mt}" x2="${X(x)}" y2="${mt+ph}" style="stroke:var(--line)" stroke-width="${lab?1:.6}"/>`; if(lab) g+=`<text x="${X(x)}" y="${mt+ph+17}" text-anchor="middle" font-size="12" style="fill:var(--muted)">${+x.toFixed(2)}</text>`; }
  for(let y=y0;y<=o.ymax+1e-9;y+=o.ys){ const lab=Math.round((y-y0)/o.ys)%(o.yl||1)===0; g+=`<line x1="${ml}" y1="${Y(y)}" x2="${ml+pw}" y2="${Y(y)}" style="stroke:var(--line)" stroke-width="${lab?1:.6}"/>`; if(lab) g+=`<text x="${ml-7}" y="${Y(y)+4}" text-anchor="end" font-size="12" style="fill:var(--muted)">${+y.toFixed(2)}</text>`; }
  g+=`<line x1="${ml}" y1="${Y(0)}" x2="${ml+pw}" y2="${Y(0)}" style="stroke:var(--ink)" stroke-width="1.5"/><line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}" style="stroke:var(--ink)" stroke-width="1.5"/>`;
  (o.lines||[]).forEach(p=>g+=`<polyline points="${p.map(([x,y])=>`${X(x)},${Y(y)}`).join(" ")}" fill="none" style="stroke:var(--data)" stroke-width="2.6" stroke-linejoin="round"/>`);
  g+=`<text x="${ml+pw/2}" y="${h-6}" text-anchor="middle" font-size="13" style="fill:var(--ink)">${o.xt}</text><text transform="translate(14 ${mt+ph/2}) rotate(-90)" text-anchor="middle" font-size="13" style="fill:var(--ink)">${o.yt}</text>`;
  return `<figure><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.aria||"Graph"}">${g}</svg>${o.cap?`<figcaption class="muted" style="font-size:.85rem">${o.cap}</figcaption>`:""}</figure>`; }

const pscore=p=>{ const s=saved[p.id]; if(!s||!s.done) return null;
  if(p.opts) return s.c===p.a?1:0; if(p.lor) return +s.v||0; return (s.t||[]).filter(Boolean).length; };

function partHTML(p,qi){ const s=saved[p.id]||{};
  let body="";
  if(p.opts){ body=`<div class="xmcq">${p.opts.map((o,j)=>`<label class="${s.done?(j===p.a?"right":(j===s.c?"wrong":"")):""}"><input type="radio" name="${p.id}" value="${j}" ${s.c===j?"checked":""}><span><b>${"ABCD"[j]}</b> ${o}</span></label>`).join("")}</div><div class="xbtns"><button class="btn primary" data-xmcq="${p.id}">Check</button></div>`; }
  else { body=window.EXAM_WORK&&!p.lor?window.EXAM_WORK(p,s):`<textarea class="xans" data-xw="${p.id}" rows="${p.lines||3}" aria-label="Your answer to part ${p.l}" placeholder="Write your answer and working here">${(s.w||"").replace(/</g,"&lt;")}</textarea>`;
    if(p.ans) body+=`<div class="xfinal"><span>Final answer</span><input type="text" inputmode="decimal" data-xin="${p.id}" value="${String(s.f??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}" aria-label="Final answer" autocomplete="off"><span class="u">${p.ans.unit||""}</span><button class="btn" data-xchk="${p.id}">Check answer</button></div>`;
    body+=`<div class="xbtns"><button class="btn primary" data-xms="${p.id}">${s.done?(s.hid?"Show mark scheme":"Hide mark scheme"):"Mark it: show mark scheme"}</button></div>`; }
  let ms="";
  if(p.lor){ ms=`<div class="xmsh"><span>Levels of response mark scheme</span><span>Award: <select data-xlor="${p.id}">${Array.from({length:p.m+1},(_,i)=>`<option value="${i}" ${+s.v===i?"selected":""}>${i}</option>`).join("")}</select> / ${p.m}</span></div>${p.lor.map(([lv,d])=>`<div class="lv"><b>${lv}</b><span>${d}</span></div>`).join("")}${p.ind?`<div class="note"><b>Indicative scientific content</b><ul>${p.ind.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}`; }
  else if(!p.opts){ ms=`<div class="xmsh"><span>Mark scheme · tick each mark you earned</span><span id="${p.id}-pm"></span></div>${p.ms.map(([c,t],j)=>`<label><input type="checkbox" data-xt="${p.id}" data-j="${j}" ${(s.t||[])[j]?"checked":""}><code>${c}</code><span>${t}</span></label>`).join("")}${p.note?`<div class="note">${p.note}</div>`:""}`; }
  const fb=p.opts&&s.done?`<div class="xfb ${s.c===p.a?"ok":"nok"}">${s.c===p.a?"<b>Correct.</b> ":"<b>Not this one.</b> Answer: "+"ABCD"[p.a]+". "}${p.why||""}</div>`:"";
  return `<div class="xp" data-p="${p.id}"><div class="xpq"><span class="xpl">${p.l?`(${p.l})`:""}</span><div>${p.ht?'<span class="ht">Higher</span> ':""}${p.q}</div><span class="xm">[${p.m}]</span></div><div class="xbody">${body}${p.help&&window.EXAM_HELP?window.EXAM_HELP(p):""}<div class="xfb" id="${p.id}-fb" hidden></div>${ms?`<div class="xms" id="${p.id}-ms" ${s.done&&!s.hid?"":"hidden"}>${ms}</div>`:""}${fb}</div></div>`; }

function cardHTML(cid){ const c=CARDS[cid]; let qn=c.start||1;
  const qs=c.qs.map(q=>{ const n=qn++; const parts=q.parts.map(p=>partHTML(p)).join(""); const t=q.parts.reduce((a,p)=>a+p.m,0);
    return `<div class="xq"><div class="xq-head"><span class="xqn">${n}</span><div class="xstem">${q.stem||""}</div></div><div class="xparts">${parts}</div>${q.parts.length>1?`<div class="xqtot">Total for question ${n}: ${t} marks</div>`:""}</div>`; }).join("");
  return `<h3>${kind}${c.title} <span class="qscore" id="${cid}-score"></span></h3>${c.intro?`<p class="xintro">${c.intro}</p>`:""}${qs}<div class="xfoot"><span class="muted" id="${cid}-sum"></span><button class="btn" data-xreset="${cid}">Clear my answers</button></div>`; }

function build(cid,cfg){ let k=0; CARDS[cid]=cfg; cfg.qs.forEach((q,qi)=>q.parts.forEach((p,pi)=>{ p.id=`${cid}q${qi}${L[pi]}`; if(q.parts.length>1&&p.l==null) p.l=L[pi]; if(!p.opts&&!p.lor&&p.ms&&p.ms.length!==p.m) console.warn("mark count",p.id); p.card=cid; p.tag=p.tag||cfg.tag; PARTS[p.id]=p; }));
  const el=document.createElement("div"); el.className="lcard exam"; el.id=cid; el.innerHTML=cardHTML(cid); return el; }
function rerender(cid){ $("#"+cid).innerHTML=cardHTML(cid); refresh(cid); }
function allParts(cid){ return CARDS[cid].qs.flatMap(q=>q.parts).filter(p=>!(p.ht&&window.TIER==="f")); }
function refresh(cid){ const ps=allParts(cid), T=ps.reduce((a,p)=>a+p.m,0); let got=0,mk=0,mt=0;
  ps.forEach(p=>{ const v=pscore(p); if(v!=null){ got+=v; mk++; mt+=p.m; } const e=$(`#${p.id}-pm`); if(e&&!p.lor){ const s=saved[p.id]; e.textContent=s&&s.done?`${pscore(p)} / ${p.m}`:""; } });
  $(`#${cid}-score`).textContent=`${got} / ${T} marks`;
  $(`#${cid}-sum`).textContent=mk?`${mk} of ${ps.length} parts marked · ${got} out of ${mt} on the parts marked so far`:`${ps.length} parts · ${T} marks. Answer, then use the mark scheme to mark yourself honestly.`;
  if(CARDS[cid].onChange) CARDS[cid].onChange(); }

function attach(lid,cfg,before){ const sec=$("#lab-"+lid+" .lsec"); if(!sec) return; const cid="xm-"+lid+(cfg.suffix||"");
  const el=build(cid,{tag:lid,...cfg}); if(before){ const b=before(sec); b?sec.insertBefore(el,b):sec.appendChild(el); } else sec.appendChild(el); refresh(cid); return cid; }

document.addEventListener("click",e=>{ const t=e.target.closest("[data-xms],[data-xmcq],[data-xchk],[data-xreset],[data-xgo]"); if(!t) return;
  if(t.dataset.xgo){ location.hash=t.dataset.xgo; return; }
  if(t.dataset.xreset){ const cid=t.dataset.xreset; if(!confirm("Clear your written answers and marks for this section?")) return; allParts(cid).forEach(p=>delete saved[p.id]); save(); rerender(cid); return; }
  const id=t.dataset.xms||t.dataset.xmcq||t.dataset.xchk, p=PARTS[id], s=saved[id]=saved[id]||{};
  if(t.dataset.xmcq){ const sel=$(`input[name="${id}"]:checked`); const fb=$(`#${id}-fb`); if(!sel){ fb.hidden=false; fb.className="xfb nok"; fb.textContent="Choose an answer first."; return; } s.c=+sel.value; s.done=true; save(); rerender(p.card); return; }
  if(t.dataset.xms){ const ms=$(`#${id}-ms`); if(!s.done){ s.done=true; s.hid=false; if(!s.t) s.t=[]; } else s.hid=!s.hid; ms.hidden=!!s.hid; t.textContent=s.hid?"Show mark scheme":"Hide mark scheme"; save(); refresh(p.card); return; }
  if(t.dataset.xchk){ const raw=$(`[data-xin="${id}"]`).value, v=num(raw), fb=$(`#${id}-fb`); fb.hidden=false; s.f=raw;
    if(isNaN(v)){ fb.className="xfb nok"; fb.textContent="Enter a number or expression, such as 1/4, sqrt(2) or 3.2e-3."; save(); return; }
    const a=p.ans, tol=a.tol??0.03, x=a.abs?Math.abs(v):v, ok=NumericTools.matches(x,a.a,tol,a.atol??0);
    if(ok){ const single=p.m===1&&p.ms.length===1;
      fb.className="xfb ok"; fb.innerHTML=single?"<b>Final answer correct.</b> One mark awarded.":"<b>Final numerical value correct.</b> Open the mark scheme and tick the marks earned for working, accuracy and any explanation. A matching number alone does not establish all the required method marks.";
      s.done=true; s.hid=false; s.t=s.t||[]; if(single) s.t=[true]; save();

  const order=Object.keys(by).sort((a,b)=>+a.replace(/\D/g,"")-+b.replace(/\D/g,""));
  $(`#${P}-bd`).innerHTML=order.map(t=>{ const r=by[t], pc=r.m?r.g/r.m*100:0, low=r.m&&pc<60;

/* countdown timer */
const TK=`learn-${id}-paper-timer`; let tm=store.get(TK)||{left:MINS*60,run:false,at:0}, iv=null;
const left=()=>tm.run?tm.left-(Date.now()-tm.at)/1000:tm.left;
function show(){ const l=left(), el=$(`#${P}-t`); if(l<=0){ el.textContent="Time’s up"; el.classList.add("up"); if(tm.run){ tm={left:0,run:false,at:0}; store.set(TK,tm); stop(); } } else { const s=Math.ceil(l); el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; el.classList.remove("up"); } $(`#${P}-start`).textContent=tm.run?"Pause timer":(tm.left<MINS*60&&tm.left>0?"Resume timer":"Start timer"); }
function stop(){ clearInterval(iv); iv=null; }
$(`#${P}-start`).addEventListener("click",()=>{ if(tm.run){ tm={left:left(),run:false,at:0}; stop(); } else if(left()>0){ tm={left:tm.left,run:true,at:Date.now()}; iv=setInterval(show,500); } store.set(TK,tm); show(); });

};

<script>
/* GCSE helpers: higher-tier badges, equation tags, store bars */
window.G=(()=>{
const HT='<span class="ht">Higher</span>';
const R='<span class="eqk rc">Recall</span>', S='<span class="eqk">Equation sheet</span>';
const ht=html=>`<div class="htbox">${HT} ${html}</div>`;
const eb=(spec,n)=>`AQA GCSE Physics · ${spec}${n?` · Lesson ${n}`:""}`;
/* horizontal bar chart in SVG: items [[label,value,cls]] ; returns markup */
function hbars(items,x,y,w,max,o={}){ const bh=o.bh||22, gap=o.gap||10, lw=o.lw||150, unit=o.unit||"J", dp=o.dp??0; let g="";
  items.forEach(([lab,val,cls],i)=>{ const yy=y+i*(bh+gap), L=Math.max(0,Math.min(1,val/max))*(w-lw-70);
    g+=`<text x="${x+lw-8}" y="${yy+bh/2+4}" text-anchor="end" font-size="13">${lab}</text><rect x="${x+lw}" y="${yy}" width="${w-lw-70}" height="${bh}" rx="3" class="fsunk"/><rect x="${x+lw}" y="${yy}" width="${L.toFixed(1)}" height="${bh}" rx="3" class="${cls||"facc"}"/><text x="${x+lw+L+6}" y="${yy+bh/2+4}" font-size="12" class="tm">${(+val).toFixed(dp)} ${unit}</text>`; });
  return g; }

/* particle box on a canvas: mode solid | liquid | gas; w (0–1 fraction of width used, for pistons); speed scale */
function particles(cv,o={}){ const P={mode:o.mode||"gas",n:o.n||40,speed:o.speed||1,w:1,r:o.r||5,hits:0,col:o.col||"#c4531a",list:[]};
  function seed(){ P.list=[]; const n=P.n; for(let i=0;i<n;i++){ const a=Math.random()*6.283; P.list.push({x:Math.random(),y:Math.random(),vx:Math.cos(a),vy:Math.sin(a),hx:0,hy:0}); }
    if(P.mode!=="gas"){ const ar=o.aspect||.6, cols=Math.ceil(Math.sqrt(n/(ar*0.8))), dx=1/cols; P.dx=dx; P.list.forEach((p,i)=>{ const r=Math.floor(i/cols); p.hx=((i%cols)+.5+(P.mode==="liquid"?(Math.random()-.5)*.5:0))*dx; p.hy=1-(r+.5)*dx/ar*(P.mode==="liquid"?1.08:1); p.x=p.hx; p.y=p.hy; }); } }
  function step(dt){ const L=P.list; P.hits=0;
    if(P.mode==="solid"){ L.forEach(p=>{ p.x=p.hx+(Math.random()-.5)*.012*P.speed; p.y=p.hy+(Math.random()-.5)*.012*P.speed; }); return; }
    if(P.mode==="liquid"){ L.forEach(p=>{ p.hx+=(Math.random()-.5)*.01*P.speed; p.hx=Math.max(.03,Math.min(.97,p.hx)); p.x=p.hx+(Math.random()-.5)*.012*P.speed; p.y=p.hy+(Math.random()-.5)*.012*P.speed; }); return; }
    L.forEach(p=>{ p.x+=p.vx*P.speed*dt*.5; p.y+=p.vy*P.speed*dt*.5; if(p.x<0){p.x=-p.x;p.vx*=-1;} if(p.x>P.w){p.x=2*P.w-p.x;p.vx*=-1;P.hits++;} if(p.y<0){p.y=-p.y;p.vy*=-1;} if(p.y>1){p.y=2-p.y;p.vy*=-1;} }); }
  function draw(){ if(!cv||!cv.offsetParent) return; const w=cv.clientWidth, h=Math.round(w*(o.aspect||.6)), dpr=window.devicePixelRatio||1; if(cv.width!==Math.round(w*dpr)){ cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px"; }
    const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h); const pad=8, bw=(w-2*pad), bh=h-2*pad;
    c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--panel"); c.fillRect(pad,pad,bw*P.w,bh); c.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--ink"); c.lineWidth=2; c.strokeRect(pad,pad,bw*P.w,bh);
    if(o.piston){ c.fillStyle="#8a929a"; c.fillRect(pad+bw*P.w,pad,10,bh); c.fillRect(pad+bw*P.w+10,pad+bh/2-5,w,10); }
    const rr=P.mode!=="gas"&&P.dx?.4*bw*P.dx:P.r; c.fillStyle=P.col; P.list.forEach(p=>{ c.beginPath(); c.arc(pad+Math.min(p.x,P.w)*bw,pad+p.y*bh,rr,0,6.283); c.fill(); }); }
  seed(); return {P,seed,step,draw}; }
return {HT,R,S,ht,eb,hbars,particles};
})();

<script>
/* GCSE Maths helpers: handwritten worked examples, fill-the-gap practice, pen-drawn SVG */
window.M=(()=>{
const {$,$$,store,W}=LAB;
const HT='<span class="ht">Higher</span>';
const NC='<span class="calc no">Non-calculator</span>', CA='<span class="calc">Calculator</span>';
let n=0;
const eb=(area,n)=>`Edexcel GCSE Maths (1MA1) · ${area}${n?` · Lesson ${n}`:""}`;
const fr=W.fr, sq=W.sq;
/* ---- handwritten worked example ----
   lines: [ink, note] or {m:ink, n:note, ans:true, wrap:true} */
function hand(title,q,lines,o={}){ const id="hw"+(++n);
  const L=lines.map((l,i)=>{ const x=Array.isArray(l)?{m:l[0],n:l[1]}:l; const len=String(x.m).replace(/<[^>]+>/g,"").length; const dur=x.fig?1.6:Math.min(2.4,0.45+len*0.045);
    return `<div class="hw-line${x.ans?" hwans":""}" style="--dur:${dur.toFixed(2)}s"><span class="hw-n">${i+1}</span><div class="hw-ink${x.wrap||x.fig?" wrap":""}">${x.ans?`<span class="a">${x.m}</span>`:(x.fig||x.m)}</div>${x.n?`<div class="hw-note">${x.n}</div>`:"<div></div>"}</div>`; }).join("");
  return `<div class="lcard hw ex" id="${id}"><h3><span class="kind k-ex">Worked example</span>${title}${o.ht?" "+HT:""}${o.calc===false?NC:o.calc?CA:""}</h3><div class="hw-q">${q}</div><div class="paper">${L}</div><div class="exbtns"><button class="btn primary" data-hwnext="${id}">Write the next line</button><button class="btn" data-hwall="${id}">Show all</button><button class="btn" data-hwre="${id}">Start again</button></div></div>`; }
document.addEventListener("click",e=>{ const t=e.target.closest("[data-hwnext],[data-hwall],[data-hwre]"); if(!t) return;
  const id=t.dataset.hwnext||t.dataset.hwall||t.dataset.hwre, card=document.getElementById(id), ls=[...card.querySelectorAll(".hw-line")], nx=card.querySelector("[data-hwnext]");
  if(t.dataset.hwnext){ card.classList.remove("inst"); const h=ls.find(l=>!l.classList.contains("on")); if(h) h.classList.add("on"); if(!ls.some(l=>!l.classList.contains("on"))) nx.disabled=true; }
  else if(t.dataset.hwall){ card.classList.add("inst"); ls.forEach(l=>l.classList.add("on")); nx.disabled=true; }
  else { card.classList.remove("inst"); ls.forEach(l=>l.classList.remove("on")); nx.disabled=false; } });
/* ---- technique box ---- */
const tech=(title,steps)=>`<div class="tech"><h4>${title}</h4><ol>${steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>`;
/* ---- fill the gaps ----
   items: {q, lines:["3x + 5 = 20","3x = [[15]]","x = [[5]]"], why}
   blank syntax [[ans|alt|alt]] ; optional note after "||" at end of a line */
const FKEY="maths-fill", FS=store.get(FKEY)||{};
function norm(s){ return String(s).toLowerCase().replace(/\s+/g,"").replace(/[−–]/g,"-").replace(/×/g,"*").replace(/÷/g,"/").replace(/²/g,"^2").replace(/³/g,"^3").replace(/^\+/,""); }
function val(s){ s=norm(s); if(/^-?\d*\.?\d+$/.test(s)) return +s; let m=s.match(/^(-?\d+)\/(\d+)$/); if(m) return +m[1]/+m[2]; m=s.match(/^(-?\d+)(\d+)\/(\d+)$/); return NaN; }
function same(a,b){ const A=norm(a), B=norm(b); if(A===B) return true; const x=val(a), y=val(b); return !isNaN(x)&&!isNaN(y)&&Math.abs(x-y)<=1e-9*Math.max(1,Math.abs(y)); }
function fill(title,items,o={}){ const id="fl"+(++n);
  const body=items.map((it,i)=>{ const fid=`${id}-${i}`; let k=0;
    const lines=it.lines.map(l=>{ const [txt,note]=l.split("||"); const h=txt.replace(/\[\[(.+?)\]\]/g,(m,a)=>{ const w=Math.max(3,Math.min(14,a.split("|")[0].length+2)); return `<input class="fbox" data-a="${a.replace(/"/g,"&quot;")}" data-k="${k++}" style="width:${w+1}ch" autocomplete="off" spellcheck="false" aria-label="Missing value">`; });
      return `<div class="fl">${h}${note?`<span class="fn">${note}</span>`:""}</div>`; }).join("");
    return `<div class="fi" data-f="${fid}"><div class="fq"><b class="qn">${i+1}</b>${it.q}</div><div class="paper">${lines}</div><div class="qact"><button class="btn primary" data-fchk="${fid}">Check</button><button class="btn" data-fshow="${fid}">Show answers</button></div><div class="ffb" hidden></div></div>`; }).join("");
  return `<div class="lcard fill" id="${id}"><h3><span class="kind k-fill">Fill the gaps</span>${title||"Complete the working"} <span class="qscore"></span></h3><p class="muted" style="margin:-4px 0 12px;font-size:.95rem">${o.intro||"Fill in the missing numbers or expressions in each line of working, then check. Try these before the questions below."}</p><div class="fis">${body}</div></div>`; }
function skey(fi){ if(fi.dataset.hk) return "help:"+fi.dataset.hk; const sec=fi.closest("section.lab"), card=fi.closest(".fill"); if(!sec) return null; const cards=[...sec.querySelectorAll(".fill")]; return `${sec.id.slice(4)}:${cards.indexOf(card)}:${[...card.querySelectorAll(".fi")].indexOf(fi)}`; }
function score(card){ if(!card) return; const all=[...card.querySelectorAll(".fi")].filter(f=>!(window.TIER_HID&&window.TIER_HID(f))), ok=all.filter(f=>f.dataset.st==="ok").length; card.querySelector(".qscore").textContent=`${ok} / ${all.length} correct`; }
function check(fi,silent){ const bs=[...fi.querySelectorAll("input.fbox")]; let good=0, empty=0;
  bs.forEach(b=>{ b.classList.remove("ok","no"); if(!b.value.trim()){ empty++; return; } const ok=b.dataset.a.split("|").some(a=>same(b.value,a)); b.classList.add(ok?"ok":"no"); if(ok) good++; });
  const fb=fi.querySelector(".ffb"), all=good===bs.length, it=fi._it;
  if(!silent){ fb.hidden=false; fb.className="ffb "+(all?"ok":"nok"); fb.innerHTML=all?`<b>All correct.</b> ${it&&it.why||""}`:empty&&!good?"Fill in the boxes first.":`<b>${good} of ${bs.length} correct.</b> Look again at the red boxes, or show the answers.`; }
  if(fi.dataset.st!=="shown") fi.dataset.st=all?"ok":"no";
  const k=skey(fi); if(k&&!silent){ FS[k]={v:bs.map(b=>b.value),st:fi.dataset.st}; store.set(FKEY,FS); } score(fi.closest(".fill")); }
function reveal(fi){ fi.querySelectorAll("input.fbox").forEach(b=>{ b.value=b.dataset.a.split("|")[0]; b.classList.remove("no"); b.classList.add("ok"); }); const fb=fi.querySelector(".ffb"); fb.hidden=false; fb.className="ffb ok"; fb.innerHTML=`<b>Answers shown.</b> ${fi._it&&fi._it.why||""} Cover them up and try again later.`; if(fi.dataset.st!=="ok") fi.dataset.st="shown"; const k=skey(fi); if(k){ FS[k]={v:[...fi.querySelectorAll("input.fbox")].map(b=>b.value),st:fi.dataset.st}; store.set(FKEY,FS); } score(fi.closest(".fill")); }
document.addEventListener("click",e=>{ const c=e.target.closest("[data-fchk]"), s=e.target.closest("[data-fshow]"); if(c) check(c.closest(".fi")); else if(s) reveal(s.closest(".fi")); });
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.matches("input.fbox")){ const fi=e.target.closest(".fi"), bs=[...fi.querySelectorAll("input.fbox")], i=bs.indexOf(e.target); if(i<bs.length-1) bs[i+1].focus(); else check(fi); } });
/* ---- help steps inside exam questions ---- */
function helpLines(lines){ let k=0; return lines.map(l=>{ const [txt,note]=l.split("||"); const h=txt.replace(/\[\[(.+?)\]\]/g,(m,a)=>{ const w=Math.max(3,Math.min(14,a.split("|")[0].length+2)); return `<input class="fbox" data-a="${a.replace(/"/g,"&quot;")}" data-k="${k++}" style="width:${w+1}ch" autocomplete="off" spellcheck="false" aria-label="Missing value">`; });
  return `<div class="fl">${h}${note?`<span class="fn">${note}</span>`:""}</div>`; }).join(""); }
window.EXAM_HELP=p=>`<details class="xhelp" data-hp="${p.id}"><summary>Help: fill in the steps</summary><div class="fi hfi" data-hk="${p.id}"><div class="paper">${helpLines(p.help)}</div><div class="qact"><button class="btn primary" data-fchk="1">Check my steps</button><button class="btn" data-fshow="1">Show the steps</button></div><div class="ffb" hidden></div></div></details>`;
function restoreHelp(root=document){ root.querySelectorAll(".hfi").forEach(fi=>{ const s=FS["help:"+fi.dataset.hk]; if(!s) return; const bs=[...fi.querySelectorAll("input.fbox")]; bs.forEach((b,j)=>b.value=s.v[j]||""); bs.forEach(b=>{ if(b.value.trim()&&b.dataset.a.split("|").some(a=>same(b.value,a))) b.classList.add("ok"); }); }); }
/* boxes turn green as soon as they are right */
document.addEventListener("input",e=>{ const b=e.target; if(!b.matches||!b.matches("input.fbox")) return; const ok=b.value.trim()&&b.dataset.a.split("|").some(a=>same(b.value,a)); b.classList.toggle("ok",!!ok); b.classList.remove("no");
  const fi=b.closest(".hfi"); if(fi){ const k="help:"+fi.dataset.hk; FS[k]={v:[...fi.querySelectorAll("input.fbox")].map(x=>x.value),st:fi.dataset.st||""}; store.set(FKEY,FS); const bs=[...fi.querySelectorAll("input.fbox")]; if(bs.every(x=>x.classList.contains("ok"))){ const fb=fi.querySelector(".ffb"); fb.hidden=false; fb.className="ffb ok"; fb.innerHTML="<b>All steps correct.</b> Now write your answer in the box above."; } } });
document.addEventListener("toggle",e=>{ const d=e.target; if(d.matches&&d.matches(".xhelp")&&d.open){ try{ const k="maths-help-used", u=JSON.parse(localStorage.getItem(k)||"{}"); u[d.dataset.hp]=1; localStorage.setItem(k,JSON.stringify(u)); }catch(_){ } } },true);
/* attach item data (for the "why" text) and restore saved answers once the page is built */
const REG=[]; const _fill=fill; function fillReg(title,items,o){ const h=_fill(title,items,o); REG.push(items); return h; }
function restore(){ restoreHelp(); let r=0; document.querySelectorAll(".lcard.fill").forEach(card=>{ const items=REG[r++]||[]; [...card.querySelectorAll(".fi")].forEach((fi,i)=>{ fi._it=items[i]; const k=skey(fi), s=k&&FS[k]; if(s){ const bs=[...fi.querySelectorAll("input.fbox")]; bs.forEach((b,j)=>b.value=s.v[j]||""); fi.dataset.st=s.st; bs.forEach(b=>{ if(b.value.trim()) b.classList.add(b.dataset.a.split("|").some(a=>same(b.value,a))?"ok":"no"); }); } }); score(card); }); }
/* ---- pen-drawn SVG helpers (deterministic wobble) ---- */
let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647-.5; };
function ln(x1,y1,x2,y2,cls="pen"){ const mx=(x1+x2)/2+rnd()*1.6, my=(y1+y2)/2+rnd()*1.6; return `<path class="${cls}" d="M${x1.toFixed(1)} ${y1.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}"/>`; }
const poly=(pts,closed=true,cls="pen")=>pts.map((p,i)=>i<pts.length-1||closed?ln(p[0],p[1],pts[(i+1)%pts.length][0],pts[(i+1)%pts.length][1],cls):"").join("");
const tx=(x,y,s,o={})=>`<text x="${x}" y="${y}" class="${o.c||"hwt"}" text-anchor="${o.a||"middle"}"${o.s?` style="font-size:${o.s}px"`:""}>${s}</text>`;
const circ=(x,y,r,cls="pen")=>{ const d=Math.min(0.3,3/r); return `<path class="${cls}" d="M${x+r} ${y} A${r} ${r} 0 1 1 ${(x+r*Math.cos(d)).toFixed(2)} ${(y-r*Math.sin(d)).toFixed(2)}"/>`; };
const svg=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" style="width:100%;max-width:${w}px;height:auto" role="img" aria-label="Hand-drawn diagram">${inner}</svg>`;
const ang=(x,y,r,a1,a2,cls="pen2")=>{ const p=(a)=>[x+r*Math.cos(a*Math.PI/180),y-r*Math.sin(a*Math.PI/180)]; const [x1,y1]=p(a1),[x2,y2]=p(a2); return `<path class="${cls}" d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 0 ${x2.toFixed(1)} ${y2.toFixed(1)}"/>`; };
const right=(x,y,dx,dy,s=12)=>`<path class="pen2" d="M${x+dx*s} ${y+dy*0} L${x+dx*s} ${y+dy*s} L${x} ${y+dy*s}"/>`;
const chk=(qs,t)=>LEARN.B.check(qs.map(q=>q.opts?q:{tol:0,abs:1e-6,...q}),t);
window.MGRAPH=1;

/* hand-drawn axes and curves: o={w,h,x:[min,max],y:[min,max],fns:[[f,cls]],pts:[[x,y,label]],step:1,lab:true} */
function graph(o){ const w=o.w||300,h=o.h||240,[x0,x1]=o.x,[y0,y1]=o.y,pad=o.pad||24,padL=o.padL||(Math.max(Math.abs(y0),Math.abs(y1))>=100&&x0>=0?40:24),X=x=>padL+(x-x0)/(x1-x0)*(w-padL-pad),Y=y=>h-pad-(y-y0)/(y1-y0)*(h-2*pad); let g="";
  (o.fills||[]).forEach(([P,col])=>{ g+=`<path d="M${P.map(([x,y])=>X(x).toFixed(1)+" "+Y(y).toFixed(1)).join(" L")} Z" style="fill:${col||"rgba(217,102,26,.2)"};stroke:none"/>`; });
  const st=o.step||1, lst=o.lstep||st, yst=o.ystep||st, ylst=o.ylstep||o.ystep||lst;
  if(x0<=0&&x1>=0) g+=ln(X(0),Y(y0),X(0),Y(y1)); if(y0<=0&&y1>=0) g+=ln(X(x0),Y(0),X(x1),Y(0));
  const ax=y0<=0&&y1>=0?Y(0):Y(y0), ay=x0<=0&&x1>=0?X(0):X(x0);
  for(let x=Math.ceil(x0/st)*st;x<=x1+1e-9;x+=st){ if(Math.abs(x)<1e-9) continue; g+=`<path class="pen" d="M${X(x).toFixed(1)} ${ax-3} v6"/>`; if(o.lab!==false&&Math.abs(Math.round(x/lst)*lst-x)<1e-9) g+=tx(X(x),ax+18,+x.toFixed(2),{s:14}); }
  for(let y=Math.ceil(y0/yst)*yst;y<=y1+1e-9;y+=yst){ if(Math.abs(y)<1e-9) continue; g+=`<path class="pen" d="M${ay-3} ${Y(y).toFixed(1)} h6"/>`; if(o.lab!==false&&Math.abs(Math.round(y/ylst)*ylst-y)<1e-9) g+=tx(ay-8,Y(y)+5,+y.toFixed(2),{s:14,a:"end"}); }
  g+=tx(X(x1)-6,ax-8,o.xl||"x",{s:16,a:o.xl?"end":"middle"})+tx(ay+10,Y(y1)+12,o.yl||"y",{s:16,a:"start"});
  (o.fns||[]).forEach(([f,cls,lab])=>{ let d="",on=false; for(let i=0;i<=200;i++){ const x=x0+(x1-x0)*i/200, y=f(x); if(!isFinite(y)||y<y0-1e-9||y>y1+1e-9){ on=false; continue; } d+=(on?"L":"M")+X(x).toFixed(1)+" "+Y(y).toFixed(1); on=true; } g+=`<path class="${cls||"pen"}" d="${d}"/>`; if(lab) g+=tx(lab[0]!=null?X(lab[0]):0,Y(lab[1]),lab[2],{c:cls==="pen2"?"hwt2":"hwt",s:16,a:"start"}); });
  (o.polys||[]).forEach(([P,cls,closed])=>{ g+=poly(P.map(([x,y])=>[X(x),Y(y)]),closed!==false,cls||"pen"); });
  (o.texts||[]).forEach(([x,y,t,c])=>{ g+=tx(X(x),Y(y),t,{c:c||"hwt2",s:15}); });
  (o.pts||[]).forEach(([x,y,l,c,pos])=>{ g+=`<circle cx="${X(x).toFixed(1)}" cy="${Y(y).toFixed(1)}" r="3.5" class="pfill"/>`; if(l){ const R=X(x)>w-70; g+=tx(X(x)+(R?-8:8),Y(y)+(pos==="below"?20:-8),l,{c:c||"hwt2",s:15,a:R?"end":"start"}); } });
  return svg(w,h,g); }
return {restoreHelp,rescoreFill:()=>document.querySelectorAll(".lcard.fill").forEach(score),graph,check:chk,HT,NC,CA,eb,hand,tech,fill:fillReg,restore,ln,poly,tx,circ,svg,ang,right,fr,sq,same};
})();

</script>
<script>
/* Diagrams for the practice papers (hand-drawn style, "not accurately drawn") */
window.MPF=(()=>{
const {svg,ln,tx,poly,circ,ang}=M;
const NAD=`<p class="nad">Diagram <b>NOT</b> accurately drawn</p>`;
const wrap=(s,nad=true)=>`<div class="row2 pfig">${s}</div>${nad?NAD:""}`;
const L=(x,y,t,o={})=>tx(x,y,t,{s:o.s||15,c:o.c||"hwt2",a:o.a||"middle"});
const unit=(x,y)=>{ const d=Math.hypot(x,y)||1; return [x/d,y/d]; };
const deg=(x,y)=>{ let a=Math.atan2(-y,x)*180/Math.PI; return a<0?a+360:a; };
/* any polygon: P = points; o.v vertex labels; o.s = [[i,label]] side i→i+1; o.a = [[i,label]] angle marks; o.r = [i,…] right angles; o.dash = [[i]] dashed sides */
function shape(P,o={}){ const n=P.length, C=[P.reduce((s,p)=>s+p[0],0)/n,P.reduce((s,p)=>s+p[1],0)/n]; let g="";
  P.forEach((p,i)=>{ const q=P[(i+1)%n]; if(i<n||o.closed!==false){ if(o.open&&i===n-1) return; g+=ln(p[0],p[1],q[0],q[1],(o.dash||[]).includes(i)?"pen dash":"pen"); } });
  (o.v||[]).forEach((t,i)=>{ if(!t) return; const p=P[i], [ux,uy]=unit(p[0]-C[0],p[1]-C[1]); g+=tx(p[0]+ux*15,p[1]+uy*15+5,t,{s:15}); });

<script>
/* Saved step-by-step working, numerical final checks and explicit self-marking. */
(()=>{
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

function mark(p,lines){

  // establish that the requested method, equation or proof has been completed.
  // Final numeric answers are checked explicitly with the Check answer button.
  const ms=p.ms||[];
  return {award:ms.map(()=>false),by:ms.map(()=>-1),hitsBy:lines.map(()=>[])}; }

  const ins=$$(".wl",box), lines=ins.map(i=>i.value), r=mark(p,lines);
  ins.forEach((inp,i)=>{ const codes=(p.ms||[]).map((m,j)=>r.by[j]===i?m[0]:null).filter(Boolean), st=inp.parentNode.querySelector(".wst"), good=codes.length>0||(r.hitsBy[i]||[]).length>0;
    inp.classList.toggle("ok",good&&!!inp.value.trim()); st.innerHTML=codes.length?`✓ ${codes.join(" ")}`:(good&&inp.value.trim()?"✓":""); });
  const sum=document.getElementById(id+"-wsum"); if(sum) sum.textContent=lines.some(l=>l.trim())?`Working saved. Use Check answer for a numerical final answer, or self-mark against the mark scheme.`:"";

 outcomes:[["Understand and use the structure of mathematical proof, from assumptions through logical steps to a conclusion","1.1"],["Use proof by deduction and proof by exhaustion","1.1"],["Use disproof by counter-example","1.1"]],
 blocks:[
  B.text("The methods",tech("Proof by deduction",["Write general numbers algebraically: an even number is 2n, an odd number is 2n + 1, consecutive integers are n and n + 1 (n an integer).","Manipulate the algebra until the result is in the required form, e.g. 4(…) for a multiple of 4.","Finish with a concluding sentence that states what you have shown."])+tech("Proof by exhaustion",["Split the problem into a finite number of cases that cover every possibility (e.g. n even and n odd, or n = 3k, 3k + 1, 3k + 2).","Prove the statement in each case."])+tech("Disproof by counter-example",["Find one example where the statement is false.","Show clearly that it fails, and state that the statement is therefore not true."])+`<p><b>Useful notation.</b> ⇒ means "implies"; ⇐ means "is implied by"; ⇔ means "if and only if". ∈ means "is a member of", and ℤ, ℕ, ℚ, ℝ are the integers, natural numbers, rationals and reals.</p>`),
  hand("Proof by deduction","Prove that the sum of any three consecutive integers is a multiple of 3.",[
   ["Let the integers be n, n + 1, n + 2, where n ∈ ℤ","define the general case"],
   ["n + (n + 1) + (n + 2) = 3n + 3","add"],
   ["= 3(n + 1)","factorise"],
   {m:"n + 1 is an integer, so the sum is a multiple of 3 ∎",ans:true,n:"conclusion"}]),
  hand("Proof by exhaustion","Prove that n² + n is even for all positive integers n.",[
   ["Case 1: n even, n = 2k: n² + n = 4k² + 2k = 2(2k² + k)","even"],
   ["Case 2: n odd, n = 2k + 1: n² + n = (2k + 1)(2k + 2) = 2(2k + 1)(k + 1)","even"],
   {m:"Every integer is even or odd, so n² + n is always even ∎",ans:true}]),

 blocks:[

  hand("Centre and radius","Find the centre and radius of x² + y² − 6x + 4y − 12 = 0.",[
   ["(x − 3)² − 9 + (y + 2)² − 4 − 12 = 0","complete the square"],

   {m:"centre (3, −2), radius 5",ans:true}]),
  hand("Tangent at a point","The circle (x − 3)² + (y + 2)² = 25 passes through P(6, 2). Find the tangent at P.",[
   [`gradient of radius = ${fr("2 − (−2)","6 − 3")} = ${fr("4","3")}`,""],
   [`tangent gradient = −${fr("3","4")}`,"perpendicular"],
   ["y − 2 = −¾(x − 6) ⇒ 4y − 8 = −3x + 18",""],

<script>
/* D1: differentiation from first principles */
(()=>{
const {B,lesson}=LEARN, {hand,tech,fill}=M, {eb,fr,sup,dd,plot,sl,ro,val,set,on,r,stage}=AM;
lesson({id:"d1",group:"a",num:1,lvl:"Pure 1 · Lesson 14",name:"First principles",icon:"tangent",
 eyebrow:eb("Pure · Differentiation",14),title:"The gradient of a curve and differentiation from first principles",
 intro:"The gradient of a curve at a point is the gradient of the tangent there. Take a chord from x to x + h and let h shrink to zero: the limit of the chord's gradient is the derivative f′(x).",
 outcomes:[["Understand and use the derivative of f(x) as the gradient of the tangent to the graph of y = f(x) at a general point (x, y); the gradient of the tangent as a limit; interpretation as a rate of change","7.1"],["Show differentiation from first principles for small positive integer powers of x and for sin x and cos x","7.1"],["Sketch the gradient function for a given curve; second derivatives","7.1"]],
 blocks:[
  B.text("The definition",`<div class="formula">f′(x) = lim<sub>h→0</sub> ${fr("f(x + h) − f(x)","h")}</div>`+tech("Proof from first principles",["Write f(x + h) and expand it.","Subtract f(x) and divide by h (every remaining term has a factor of h).","Let h → 0: terms still containing h vanish.","Say clearly 'as h → 0'."])),
  B.sim("d1-sim","Chord to tangent",stage("d1",true),sl("d1-x","point x",-2,2,0.1,1)+sl("d1-h","h",0.01,2,0.01,1)+ro([["d1-c","Chord gradient"],["d1-t","Tangent gradient 2x"]]),`<span>y = x²: shrink h and watch the chord become the tangent</span>`),
  hand("Proof for x³","Prove from first principles that the derivative of x³ is 3x².",[
   [`${fr("(x + h)³ − x³","h")}`,""],
   [`= ${fr("x³ + 3x²h + 3xh² + h³ − x³","h")}`,"expand"],
   ["= 3x² + 3xh + h²","divide by h"],
   {m:"as h → 0, this → 3x², so f′(x) = 3x²",ans:true}]),
  hand("Gradient at a point","Use first principles to find the gradient of y = 2x² − x at x = 3.",[
   [`${fr("2(3 + h)² − (3 + h) − 15","h")}`,"f(3) = 15"],
   [`= ${fr("18 + 12h + 2h² − 3 − h − 15","h")} = ${fr("11h + 2h²","h")}`,""],
   ["= 11 + 2h",""],
   {m:"→ 11 as h → 0",ans:true}]),
  fill("",[
   {q:"For f(x) = x², simplify [f(x + h) − f(x)]/h.",lines:["(x² + 2xh + h² − x²)/h = 2x + [[h]]","limit as h → 0: [[2x]]"],why:"The h term vanishes."},
   {q:"For f(x) = 5x, find the chord gradient between x and x + h.",lines:["(5x + 5h − 5x)/h = [[5]]"],why:"A straight line."},
   {q:"The chord gradient of y = x² from x = 1 to x = 1 + h is 2 + h. Find it when h = 0.1.",lines:["[[2.1]]"],why:"Approaches 2."}]),
  M.check([
   {q:"Using the chord from x = 2 to x = 2.1 on y = x², find the chord gradient.",a:4.1,tol:0.001},
   {q:"What is the gradient of y = x² at x = −3?",a:-6},
   {q:"In the first principles expansion of (x + h)⁴, the coefficient of x³h is …",a:4},
   {q:"The gradient of the tangent is the limit of the gradient of …",opts:["a normal","a chord as h → 0","the curve at x = 0","the second derivative"],a:1},
   {q:"For f(x) = x² + 3, f′(x) at x = 5 is …",a:10}]),
  B.keypoints(["f′(x) = lim (f(x + h) − f(x))/h as h → 0.","Expand, subtract, divide by h, then let h → 0.","The derivative is the gradient function and a rate of change."]),
  B.mistakes(["Setting h = 0 before dividing by h.","Expanding (x + h)³ incorrectly.","Not writing the limit statement."])
 ],onShow:()=>draw()});
function draw(){ const x=val("d1-x"), h=val("d1-h"); set("d1-x-l",r(x,1)); set("d1-h-l",r(h,2)); const f=t=>t*t, m=(f(x+h)-f(x))/h;
  set("d1-plot",plot({x:[-3,4],y:[-2,10],xs:1,ys:1,fns:[{f,lab:"y = x²",lx:-2.6},{f:t=>f(x)+m*(t-x),c:1,lab:"chord"},{f:t=>f(x)+2*x*(t-x),c:2,dash:true}],pts:[{x,y:f(x),c:0,lab:"P"},{x:x+h,y:f(x+h),c:1,lab:"Q"}],aria:"Chord and tangent to y = x squared"}));
  set("d1-c",r(m,4)); set("d1-t",r(2*x,4)); set("d1-note",`Chord gradient = 2x + h = ${r(2*x,2)} + ${r(h,2)}. As h → 0 it approaches ${r(2*x,2)} (green dashed tangent).`); }
on(["d1-x","d1-h"],draw); draw();
})();

 intro:"A function maps each input in its domain to exactly one output. Composite functions apply one function then another; an inverse function undoes a one-one function, and its graph is the reflection in y = x. The modulus |x| makes values non-negative.",
 outcomes:[["Understand and use the modulus function, including the notation |x|, and the graphs of y = |f(x)| and y = f(|x|); solve equations and inequalities involving modulus","2.7, 2.8"],["Understand and use definitions of functions, including domain and range; composite functions; inverse functions and their graphs","2.8"],["Use functions in modelling","2.11"]],
 blocks:[

  B.sim("r2-sim","Modulus transformations",stage("r2",true),field("f(x)",seg("r2-f",Object.entries(F).map(([k,v])=>[k,v[1]]),2,"sq"))+field("Graph",seg("r2-t",[["f","y = f(x)"],["m","y = |f(x)|"],["a","y = f(|x|)"],["i","inverse (where one-one)"]],2,"m"))+ro([["r2-e","Showing"],["r2-n","Note"]]),`<span>Grey: y = f(x)</span>`),
  hand("Composite and inverse","f(x) = 2x + 1 and g(x) = x², x ∈ ℝ. Find fg(3), gf(x) and f⁻¹(x).",[

   ["gf(x) = (2x + 1)²",""],
   ["y = 2x + 1 ⇒ x = (y − 1)/2",""],
   {m:"19;  (2x + 1)²;  f⁻¹(x) = (x − 1)/2",ans:true}]),

   ["2x − 3 = x ⇒ x = 3",""],

function draw(){ const k=radio("r2-f"), t=radio("r2-t"), [f,nm]=F[k]; let fns=[{f,c:4,w:1.6}], note="", lab="";

<script>

<script>

 blocks:[

  hand("Cooling",`A drink cools according to dθ/dt = −k(θ − 20). Initially θ = 90 °C. Show that θ = 20 + 70e<sup>−kt</sup>.`,[

   {q:"dP/dt = kP, P doubles in 5 years. Find k (3 s.f.).",a:0.139,tol:0.005}]),

  B.mistakes(["Adding a constant on both sides.","Writing ln y = x + c ⇒ y = eˣ + c.","Ignoring the sign in decay models."])

function draw(){ const k=val("c6-k"), y0=val("c6-y0"); set("c6-k-l",r(k,1)); set("c6-y0-l",r(y0,1)); const L=10, F=(x,y)=>k*y*(1-y/L), sol=t=>L/(1+(L/y0-1)*Math.exp(-k*t));

  set("c6-y5",r(sol(5),3)); set("c6-lim",r(L)); set("c6-note","The solution is y = 10 / (1 + Ae<sup>−kt</sup>): it levels off at 10 whatever the starting value."); }

<script>

(()=>{

lesson({id:"c7",group:"c",num:7,lvl:"Pure 2 · Lesson 16",name:"Numerical methods",icon:"numer",
 eyebrow:eb("Pure · Numerical methods",16),title:"Locating roots, iteration, Newton–Raphson and the trapezium rule",
 intro:"When an equation cannot be solved algebraically, use numerical methods. A change of sign locates a root; iteration and the Newton–Raphson method home in on it. The trapezium rule estimates a definite integral.",
 outcomes:[["Locate roots of f(x) = 0 by considering changes of sign of f(x) in an interval on which f(x) is sufficiently well-behaved; understand how change of sign methods can fail","9.1"],["Solve equations approximately using simple iterative methods; be able to draw associated cobweb and staircase diagrams","9.2"],["Solve equations using the Newton–Raphson method and other recurrence relations; understand how such methods can fail","9.2"],["Understand and use numerical integration of functions, including the use of the trapezium rule and estimating the approximate area under a curve and limits that it must lie between","9.3"],["Use numerical methods to solve problems in context","9.4"]],
 blocks:[
  B.text("Methods",`<div class="formula">Newton–Raphson: x<sub>n+1</sub> = xₙ − ${fr("f(xₙ)","f′(xₙ)")}<br>Trapezium rule: ${intg("a","b")}y dx ≈ ½h[y₀ + 2(y₁ + y₂ + … + y<sub>n−1</sub>) + yₙ],  h = (b − a)/n</div>`+tech("Notes",["Change of sign: if f is continuous and f(a), f(b) have opposite signs, there is a root between a and b. It fails at asymptotes and repeated roots.","Iteration xₙ₊₁ = g(xₙ) converges if |g′(x)| &lt; 1 near the root: staircase or cobweb diagram.","Newton–Raphson fails if f′(xₙ) = 0 (tangent horizontal).","The trapezium rule overestimates for a convex curve and underestimates for a concave one."])),
  B.sim("c7-sim","Newton–Raphson and the trapezium rule",stage("c7",true),field("Method",seg("c7-m",[["nr","Newton–Raphson"],["tr","Trapezium rule"]],2,"nr"))+sl("c7-x0","starting value x₀",0.2,3,0.1,2.5)+sl("c7-n","strips n / steps",1,8,1,3)+ro([["c7-v","Estimate"],["c7-t","True value"]]),`<span>f(x) = x³ − 2x − 1 (root) · ∫₀² √(x + 1) dx (area)</span>`),
  hand("Change of sign","Show that f(x) = x³ − 2x − 1 has a root between 1.6 and 1.7.",[
   ["f(1.6) = 4.096 − 3.2 − 1 = −0.104",""],
   ["f(1.7) = 4.913 − 3.4 − 1 = 0.513",""],

   ["x₁ = 1.6 − (−0.104)/5.68",""],
   {m:"x₁ = 1.618 (3 d.p.)",ans:true,n:"the exact root is (1 + √5)/2 = 1.618…"}]),
  hand("Trapezium rule","Use the trapezium rule with 4 strips to estimate ∫₀² √(x + 1) dx.",[

  hand("One-tail test","A drug is claimed to cure 40% of patients. A doctor believes it is less effective. In a trial of 20 patients, 4 are cured. Test at the 5% level.",[

   {q:"The significance level is the probability of …",lines:["incorrectly [[rejecting]] H₀"],why:"Rejecting a true null hypothesis."}]),
  M.check([

   {q:"P(X ≤ 3) = 0.016 and P(X ≤ 4) = 0.051 under H₀. Critical region for H₁: p &lt; p₀ at 5%: X ≤ …",a:3},

  B.mistakes(["Writing hypotheses in terms of X.","Using P(X = x) instead of a tail probability.","Forgetting to halve the level for a two-tail test."])

function draw(){ const n=val("s6-n"), p=val("s6-p"), t=radio("s6-t"), a=+radio("s6-a"); set("s6-n-l",n); set("s6-p-l",r(p,2)); const ta=t==="ne"?a/2:a;
  let lo=-1, hi=n+1; if(t!=="gt"){ while(lo+1<=n&&binC(n,p,lo+1)<=ta+1e-12) lo++; } if(t!=="lt"){ while(hi-1>=0&&1-binC(n,p,hi-2)<=ta+1e-12) hi--; }
  const P=[...Array(n+1)].map((_,x)=>binP(n,p,x)), mx=Math.max(...P), top=Math.ceil(mx*20+0.5)/20, inCR=x=>x<=lo||x>=hi;
  set("s6-plot",plot({x:[-1,n+1],y:[0,top],ys:top>0.3?0.1:0.05,rects:P.map((v,x)=>({x:x-0.4,y:0,w:0.8,h:v,cls:inCR(x)?"sh5":"sh1"})),xl:"x",yl:"P(X = x)",aria:"Critical region bar chart"}));
  const parts=[]; if(lo>=0) parts.push(`X ≤ ${lo}`); if(hi<=n) parts.push(`X ≥ ${hi}`); set("s6-cr",parts.length?parts.join(" or "):"none");
  const as=(lo>=0?binC(n,p,lo):0)+(hi<=n?1-binC(n,p,hi-1):0); set("s6-as",r(as,4));
  set("s6-note",`Under H₀, X ~ B(${n}, ${r(p,2)}). Each tail used has probability at most ${r(ta,3)}.`); }
on(["s6-n","s6-p"],draw); ["s6-t","s6-a"].forEach(i=>LAB.$("#"+i).addEventListener("change",draw)); draw();
})();
</script>
<script>
/* S7: normal distribution */
(()=>{
const {B,lesson}=LEARN, {hand,tech,fill}=M, {eb,fr,sq,sup,plot,sl,ro,val,set,on,r,stage,normC,normPdf,Phi}=AM;
lesson({id:"s7",group:"b",num:7,lvl:"Statistics · Lesson 7",name:"The normal distribution",icon:"normal",
 eyebrow:eb("Statistics · Statistical distributions",7),title:"The normal distribution N(μ, σ²) and the normal approximation to the binomial",
 intro:"The normal distribution is a continuous, symmetric, bell-shaped model with mean μ and standard deviation σ. Probabilities are areas under the curve. Standardising with Z = (X − μ)/σ lets you find unknown μ or σ. For large n with p near 0.5, B(n, p) is well approximated by N(np, np(1 − p)).",
 outcomes:[["Understand and use the normal distribution as a model; find probabilities using the normal distribution","4.2"],["Link to histograms, mean, standard deviation, points of inflection and the binomial distribution","4.2"],["Select an appropriate probability distribution for a context, with appropriate reasoning, including recognising when the binomial or normal model may not be appropriate","4.3"]],
 blocks:[
  B.text("Key facts",tech("Shape",["Symmetric about μ; mean = median = mode.","About 68% within 1σ, 95% within 2σ, 99.7% within 3σ.","Points of inflection at μ ± σ."])+`<div class="formula">Z = ${fr("X − μ","σ")} ~ N(0, 1);   B(n, p) ≈ N(np, np(1 − p)) when n is large and p is close to 0.5</div>`+tech("Continuity correction",["P(X ≤ 35) → P(Y &lt; 35.5)","P(X &lt; 35) → P(Y &lt; 34.5)","P(X = 35) → P(34.5 &lt; Y &lt; 35.5)"])),
  B.sim("s7-sim","Normal probabilities",stage("s7",true),sl("s7-m","μ",-5,5,0.5,0)+sl("s7-s","σ",0.5,3,0.1,1)+sl("s7-a","a",-8,8,0.1,-1)+sl("s7-b","b",-8,8,0.1,1)+ro([["s7-p","P(a &lt; X &lt; b)"],["s7-z","Standardised"]]),`<span>Dashed lines: points of inflection at μ ± σ</span>`),
  hand("Probabilities","X ~ N(50, 4²). Find P(X &lt; 55) and P(45 &lt; X &lt; 58).",[
   ["P(X &lt; 55) = 0.8944 (calculator, or Φ(1.25))",""],
   ["P(45 &lt; X &lt; 58) = Φ(2) − Φ(−1.25)",""],
   {m:"0.8944, 0.8716",ans:true}]),
  hand("Finding μ and σ","X ~ N(μ, σ²) with P(X &lt; 20) = 0.1 and P(X &gt; 35) = 0.2. Find μ and σ.",[
   ["(20 − μ)/σ = −1.2816 and (35 − μ)/σ = 0.8416",""],
   ["subtract: 15/σ = 2.1232 ⇒ σ = 7.06",""],
   {m:"μ = 20 + 1.2816 × 7.06 = 29.1; σ = 7.06",ans:true}]),
  hand("Normal approximation","X ~ B(100, 0.4). Use a normal approximation to estimate P(X ≤ 35).",[
   ["np = 40, np(1 − p) = 24, so Y ~ N(40, 24)",""],
   ["P(X ≤ 35) ≈ P(Y &lt; 35.5)",""],
   {m:"= Φ(−4.5/√24) = 0.179",ans:true}]),
  fill("",[

   {q:"X ~ N(30, 5²). The points of inflection are at x =",lines:["[[25]] and [[35]]"],why:"μ ± σ."},
   {q:"Continuity correction: P(X ≥ 20) → P(Y &gt; …)",lines:["[[19.5]]"],why:"Include 20."}]),
  M.check([
   {q:"X ~ N(100, 15²). Find P(X &lt; 120) (4 d.p.).",a:0.9088,tol:0.0005},
   {q:"About what percentage of a normal distribution lies within 2 standard deviations of the mean?",opts:["68%","95%","99.7%","50%"],a:1},
   {q:"X ~ N(μ, 4). P(X &lt; 13) = 0.5. Find μ.",a:13},
   {q:"B(50, 0.5) is approximated by N(μ, σ²). Find σ² .",a:12.5,tol:0.001},
   {q:"P(Z &gt; z) = 0.05. Find z (3 d.p.).",a:1.645,tol:0.0005}]),
  B.keypoints(["Probabilities are areas: P(X = a) = 0 for a continuous variable.","Standardise to find unknown parameters.","Apply a continuity correction when approximating a discrete distribution."]),
  B.mistakes(["Using σ² where the calculator needs σ.","Sign errors with z-values below the mean.","Forgetting the continuity correction."])
 ],onShow:()=>draw()});
function draw(){ const m=val("s7-m"), s=val("s7-s"); let a=val("s7-a"), b=val("s7-b"); if(b<a) [a,b]=[b,a]; ["m","s","a","b"].forEach(k=>set("s7-"+k+"-l",r(val("s7-"+k),1)));
  const f=x=>normPdf(x,m,s), top=Math.ceil((f(m)*1.15)*10)/10;
  set("s7-plot",plot({x:[-9,9],y:[0,top],ys:top>0.5?0.2:0.1,fns:[{f,c:1}],shade:[{f,a,b,cls:"sh0"}],segs:[{x1:m-s,y1:0,x2:m-s,y2:f(m-s),dash:1,c:4},{x1:m+s,y1:0,x2:m+s,y2:f(m+s),dash:1,c:4}],xl:"x",yl:"f(x)",aria:"Normal curve with shaded area"}));
  const p=normC(b,m,s)-normC(a,m,s); set("s7-p",r(p,4)); set("s7-z",`P(${r((a-m)/s,2)} &lt; Z &lt; ${r((b-m)/s,2)})`); set("s7-note",`X ~ N(${r(m,1)}, ${r(s,1)}²): the shaded area is ${r(p,4)}.`); }
on(["s7-m","s7-s","s7-a","s7-b"],draw); draw();
